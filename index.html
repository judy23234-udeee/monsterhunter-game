// 단계 구성(NPC_STAGES[n].POP) → 그 마을 레벨의 주민·가축 수와 NPC_BUDGET 안으로 줄인 수 (GAME_DESIGN 15-5)
function npcComposition(stageId, level) {
  const D = NPC_STAGES[stageId] || NPC_STAGES[1], C = NPC_STAGE_CONFIG, vs = Progress.villageStats(save, level), pop = { ...D.POP }, trimmed = [];
  const model = (r) => C.ROLE_MODEL[r] || r, isVill = (r) => NPC_CONFIG.SPECIES[model(r)].kind === 'villager';
  const total = (v) => Object.entries(pop).reduce((a, [r, n]) => a + (isVill(r) === v ? n : 0), 0);
  const penOf = (r) => Object.values(NPC_CONFIG.PENS).find((p) => p.SPECIES.includes(r));
  const penCount = (pen) => pen.SPECIES.reduce((a, r) => a + (pop[r] || 0), 0);
  const canDrop = (r, v) => (pop[r] || 0) > (v ? C.KEEP_MIN[r] || 0 : 0) && (v || penCount(penOf(r)) > C.PEN_MIN);
  for (const [v, cap, order] of [[true, Math.min(vs.villagers, NPC_BUDGET.VILLAGERS), C.TRIM], [false, Math.min(vs.livestock, NPC_BUDGET.LIVESTOCK), C.TRIM_ANIMALS]]) {
    while (total(v) > cap) {
      const r = order.find((k) => canDrop(k, v));
      if (!r) break;
      pop[r]--; trimmed.push(r);
    }
  }
  return { pop, trimmed, D, cap: { villagers: vs.villagers, livestock: vs.livestock } };
}

let npcs = null;
function createNPCs(stageId = 1, level = save.village.level, hooks = {}) {
  const C = NPC_CONFIG, CR = C.CRISIS, CB = C.CELEBRATE, B = NPC_BUDGET, NS = NPC_STAGE_CONFIG;
  const comp = npcComposition(stageId, level), SD = comp.D;
  const groups = [], list = [];
  let endingOn = false, celebT0 = 0, repairBeat = false, soundQ = [], bubble = null, lineK = 0;
  let vill = 0, live = 0, guardK = 0, cheerK = 0, mode = 'normal', sysT = 0, offscreen = 0;
  const frustum = new THREE.Frustum(), projM = new THREE.Matrix4(), sphere = new THREE.Sphere(new THREE.Vector3(), C.SCREEN_PAD);
  const dv = new THREE.Vector3(), landPos = new THREE.Vector3(MC.LAND_POS[0], 0, MC.LAND_POS[1]);
  const d2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
  const ringPt = (a) => new THREE.Vector3(Math.cos(a) * C.RING_R, 0, Math.sin(a) * C.RING_R);
  const monsterActive = () => monster.group.visible && MS.state !== 'hidden' && MS.state !== 'dead';
  const threatPos = () => (monsterActive() ? MS.root : landPos);

  // 광장 둘레 원을 따라 돌아서 간다 (집은 반지름 방향으로 드나든다)
  function route(from, to) {
    const pts = [], lim = C.RING_R + C.POI_JITTER;
    if (Math.hypot(from.x, from.z) > lim || Math.hypot(to.x, to.z) > lim) {
      const a0 = Math.atan2(from.z, from.x), da = wrapAngle(Math.atan2(to.z, to.x) - a0), steps = Math.max(1, Math.ceil(Math.abs(da) / C.ARC_STEP));
      for (let i = 0; i <= steps; i++) pts.push(ringPt(a0 + da * i / steps));
    }
    pts.push(to.clone());
    return pts;
  }
  function solidAt(p, pad) {
    if (d2(p, wellPos) < C.WELL_R + pad) return true;
    if (props.some((q) => Math.hypot(p.x - q.x, p.z - q.z) < q.r + pad)) return true;
    return houses.some((h) => h.alive && Math.hypot(p.x - h.x, p.z - h.z) < h.r + pad);
  }
  function randPlaza() {
    for (let k = 0; k < 20; k++) {
      const a = Math.random() * Math.PI * 2, d = R(C.PLAZA_R), p = new THREE.Vector3(Math.cos(a) * d, 0, Math.sin(a) * d);
      if (!solidAt(p, 0.5)) return p;
    }
    return new THREE.Vector3(C.PLAZA_R[1], 0, 0);
  }
  const randPen = (pen, out = new THREE.Vector3()) => {
    const m = C.PEN_MARGIN, rc = pen.rect;
    return out.set(R([rc[0] + m, rc[1] - m]), 0, R([rc[2] + m, rc[3] - m]));
  };
  // 단계가 오를수록 가축은 마을에서 먼 우리 구석에 모인다 (PEN_K = 쓰는 넓이 비율)
  function penArea(pen, k) {
    const [x0, x1, z0, z1] = pen.rect, w = (x1 - x0) * k, d = (z1 - z0) * k;
    const fx = Math.abs(x0) > Math.abs(x1), fz = Math.abs(z0) > Math.abs(z1);
    return { rect: [fx ? x0 : x1 - w, fx ? x0 + w : x1, fz ? z0 : z1 - d, fz ? z0 + d : z1] };
  }
  function taskTarget(n, place) {
    switch (place) {
      case 'well': return poi.well;
      case 'stall': return poi.stall;
      case 'anvil': return poi.anvil;
      case 'gate': return poi.gateSpots.length ? { pos: poi.gateSpots[n.spot % poi.gateSpots.length], look: poi.gate.clone().addScaledVector(poi.gateOut, 5) } : null;
      case 'fence': return poi.fence.length ? poi.fence[Math.floor(Math.random() * poi.fence.length)] : null;
      case 'door': { const hs = houses.filter((h) => h.alive); const h = hs[Math.floor(Math.random() * hs.length)]; return h ? { pos: h.door, look: new THREE.Vector3(h.x, 0, h.z) } : null; }
      case 'patrol': {   // 광장 둘레를 한 방향으로 돌며 바깥을 본다
        const P = NS.PATROL, a = n.patrolA = (n.patrolA ?? Math.atan2(n.pos.z, n.pos.x)) + P.STEP * (n.idx % 2 ? 1 : -1);
        return { pos: new THREE.Vector3(Math.cos(a) * P.R, 0, Math.sin(a) * P.R), look: new THREE.Vector3(Math.cos(a) * P.R * 3, 0, Math.sin(a) * P.R * 3) };
      }
      case 'drill': {    // 대피 훈련: 대피소 문까지 뛰어갔다가 돌아온다
        const sh = houses.find((h) => h.kind === 'shelter' && h.alive);
        return sh ? { pos: sh.door, look: new THREE.Vector3(sh.x, 0, sh.z) } : null;
      }
      case 'repair': {   // 복구 작업: 복구 중인 집·부서진 단계 오브젝트 앞에서 망치질 (없으면 모루)
        const sp = SV.repairSpots;
        return sp && sp.length ? sp[Math.floor(Math.random() * sp.length)] : poi.anvil;
      }
      default: return { pos: randPlaza(), look: null };
    }
  }
  function chooseRefuge(p) {
    let near = null, dn = Infinity, shelter = null;
    for (const h of houses) {
      if (!h.alive) continue;
      if (h.kind === 'shelter') { shelter = h; continue; }
      const d = d2(p, h.door); if (d < dn) { dn = d; near = h; }
    }
    const room = shelter && shelter.occupants.size < (shelter.capacity ?? Infinity);   // 대피소 정원 (마을 레벨)
    if (room && (!near || d2(p, shelter.door) <= dn * CR.SHELTER_PREF)) return shelter;
    return near || shelter;
  }

  // 이동 도우미
  const stand = (n, dt) => n.vel.multiplyScalar(Math.exp(-C.ACCEL * dt));
  function steerTo(n, x, z, speed, dt) {
    dv.set(x - n.pos.x, 0, z - n.pos.z);
    const d = dv.length() || 1;
    n.vel.lerp(dv.multiplyScalar(speed / d), 1 - Math.exp(-C.ACCEL * dt));
  }
  function followPath(n, speed, dt) {
    while (n.path.length && d2(n.pos, n.path[0]) < C.ARRIVE) n.path.shift();
    n.walkT = n.path.length ? n.walkT + dt : 0;
    if (!n.path.length || n.walkT > C.STUCK_TIME) { n.path = []; n.walkT = 0; stand(n, dt); return true; }   // 막히면 포기하고 다시 길을 찾게
    const tg = n.path[0], d = d2(n.pos, tg);
    steerTo(n, tg.x, tg.z, n.path.length === 1 ? clamp(d * C.ARRIVE_SLOW, C.MIN_SPEED, speed) : speed, dt);
    return false;
  }
  // 위험 범위(발·몸·예고 원·돌진 띠)에서 벗어나는 방향
  function dangerAway(n, out) {
    out.set(0, 0, 0);
    if (!monsterActive()) return false;
    let hit = false;
    const away = (px, pz, r) => {
      const dx = n.pos.x - px, dz = n.pos.z - pz, d = Math.hypot(dx, dz);
      if (d < r) { const k = (r - d) / r + 0.2; out.x += dx / (d || 1) * k; out.z += dz / (d || 1) * k; hit = true; }
    };
    for (const f of monster.feet) away(f.x, f.z, CR.FOOT_AVOID_R);
    away(MS.root.x, MS.root.z, CR.BODY_AVOID_R);
    if (dangerCircle.show > 0) away(pose.slamPoint.x, pose.slamPoint.z, MC.SLAM.R + CR.DANGER_MARGIN);
    if (dangerLane.show > 0) {
      const rx = n.pos.x - MS.root.x, rz = n.pos.z - MS.root.z, along = rx * MS.fwd.x + rz * MS.fwd.z;
      const lat = -rx * MS.fwd.z + rz * MS.fwd.x;
      if (along > -1 && along < MS.laneLen + 1 && Math.abs(lat) < MC.CHARGE.W / 2 + CR.DANGER_MARGIN) {
        const sg = lat >= 0 ? 1 : -1;   // 가까운 옆으로 비킨다
        out.x += -MS.fwd.z * sg * CR.DANGER_TURN; out.z += MS.fwd.x * sg * CR.DANGER_TURN; hit = true;
      }
    }
    return hit;
  }
  // 충돌: 건물·우물·구조물·나무·몬스터 발 밀어내기, 가축은 목장 안, 주민은 목장 밖
  function solve(n) {
    const r = n.S.RADIUS;
    const push = (px, pz, rr0) => {
      const dx = n.pos.x - px, dz = n.pos.z - pz, d = Math.hypot(dx, dz), m = rr0 + r;
      if (d < m && d > 1e-4) { n.pos.x = px + dx / d * m; n.pos.z = pz + dz / d * m; }
    };
    for (const h of houses) if (h.alive) push(h.x, h.z, h.r * C.HOUSE_COLLIDE_K);
    push(wellPos.x, wellPos.z, C.WELL_R);
    for (const p of props) push(p.x, p.z, p.r);
    for (const t of trees) if (t.angle < PLAYER_CONFIG.TREE_FALLEN) push(t.base.x, t.base.z, PLAYER_CONFIG.TREE_COLLIDE_R);
    if (monsterActive()) for (const f of monster.feet) push(f.x, f.z, MC.FOOT_BLOCK_R);
    if (n.pen) clampPen(n.area, n.pos);
    else for (const p of pens) pushOutRect(n.pos, p.rect, r);
    const lim = CONFIG.TERRAIN.HALF - C.BOUNDS_MARGIN;
    n.pos.x = clamp(n.pos.x, -lim, lim); n.pos.z = clamp(n.pos.z, -lim, lim);
  }
  function hide(n, h) { n.hidden = true; n.refuge = h; h.occupants.add(n); n.vel.set(0, 0, 0); n.path = []; }
  function emerge(n) {
    n.hidden = false;
    if (n.refuge) { n.refuge.occupants.delete(n); n.pos.copy(n.refuge.door).add(dv.set(R([-0.4, 0.4]), 0, R([-0.4, 0.4]))); }
    n.refuge = null; n.path = []; solve(n);
  }

  // 평소: 장소로 걸어가 일하고(망치질·물 긷기·장보기) 쉬기를 반복
  function routine(n, dt) {
    const patrol = n.taskPlace === 'patrol';
    if (n.state === 'walk') {
      n.act = 'none'; n.look = null;
      if (followPath(n, n.taskPlace === 'drill' ? n.S.RUN : n.S.WALK, dt)) {
        n.state = 'work'; n.t = 0; n.dur = R(patrol ? NS.PATROL.PAUSE : n.S.WORK); n.act = n.taskAct; n.look = n.taskLook;
      }
      return;
    }
    stand(n, dt);
    if ((n.t += dt) < n.dur) return;
    if (n.state === 'work' && !patrol) { n.state = 'idle'; n.t = 0; n.dur = R(n.S.IDLE); n.act = 'none'; return; }
    if (patrol && ++n.legs < NS.PATROL.LEGS) n.task--;   // 순찰은 몇 구간 이어 걷는다
    else n.legs = 0;
    const [place, act] = n.tasks[((n.task++ % n.tasks.length) + n.tasks.length) % n.tasks.length];
    const tg = taskTarget(n, place);
    if (!tg) { n.t = 0; n.dur = R(n.S.IDLE); n.taskPlace = ''; return; }
    const p = tg.pos.clone().add(dv.set(R([-1, 1]), 0, R([-1, 1])).multiplyScalar(C.POI_JITTER));
    n.path = route(n.pos, p); n.taskAct = act; n.taskLook = tg.look; n.taskPlace = place; n.state = 'walk';
  }
  // 가축 평소: 풀 뜯기/쪼기 ↔ 어슬렁 (닭은 짧게 종종걸음)
  function animalRoutine(n, dt) {
    if (n.state === 'walk') {
      n.act = 'none';
      if (followPath(n, n.S.DASH || n.S.WALK, dt)) { n.state = 'work'; n.t = 0; n.dur = R(n.S.WORK); n.act = n.S.WORK_ACT; }
      return;
    }
    stand(n, dt);
    if ((n.t += dt) < n.dur) return;
    if (n.state === 'work') { n.state = 'idle'; n.t = 0; n.dur = R(n.S.IDLE); n.act = 'none'; return; }
    const a = Math.random() * Math.PI * 2, d = R(n.S.WANDER);
    n.path = [clampPen(n.area, new THREE.Vector3(n.pos.x + Math.cos(a) * d, 0, n.pos.z + Math.sin(a) * d))];
    n.state = 'walk';
  }
  // 위기: 주민은 대피, 경비병·자원 주민은 성문으로 (예고가 오면 대피 행동은 단계와 상관없이 그대로)
  function crisisVillager(n, dt) {
    n.look = null;
    if (NS.DEFENDERS.includes(n.role)) {
      const m = threatPos(), spot = poi.gateSpots.length ? poi.gateSpots[n.spot % poi.gateSpots.length] : null;
      if (monsterActive() && d2(n.pos, m) < CR.GUARD_KEEP) {   // 몬스터가 너무 가까우면 거리를 벌림
        steerTo(n, n.pos.x * 2 - m.x, n.pos.z * 2 - m.z, n.S.RUN, dt); n.act = 'none'; n.path = []; return;
      }
      if (!spot) { stand(n, dt); return; }
      if (d2(n.pos, spot) > C.ARRIVE * 2) {
        if (!n.path.length) n.path = route(n.pos, spot);
        followPath(n, n.S.RUN, dt); n.act = 'none';
      } else {
        stand(n, dt); n.act = 'brace';
        n.look = n.lookV.copy(poi.gate).addScaledVector(poi.gateOut, 5);
      }
      return;
    }
    n.act = 'panic';
    if (!n.refuge || !n.refuge.alive) { n.refuge = chooseRefuge(n.pos); n.path = []; }
    if (!n.refuge) { const m = threatPos(); steerTo(n, n.pos.x * 2 - m.x, n.pos.z * 2 - m.z, n.S.RUN, dt); return; }
    if (!n.path.length) n.path = route(n.pos, n.refuge.door);
    if (followPath(n, n.S.RUN, dt) && d2(n.pos, n.refuge.door) < CR.DOOR_R) hide(n, n.refuge);
  }
  // 위기: 가축은 목장 안에서 몬스터 반대쪽으로 흩어짐
  function crisisAnimal(n, dt) {
    n.act = n.S.PANIC_ACT; n.look = null;
    n.fleeT -= dt;
    if (n.fleeT <= 0 || !n.path.length) {
      n.fleeT = CR.FLEE_REPICK * (0.7 + Math.random() * 0.6);
      const m = threatPos();
      let best = null, bs = -Infinity;
      for (let k = 0; k < CR.FLEE_TRIES; k++) {
        const p = randPen(n.area), sc = d2(p, m) + Math.random() * CR.SCATTER;
        if (sc > bs) { bs = sc; best = p; }
      }
      n.path = [best];
    }
    followPath(n, n.S.RUN, dt);
  }
  // 사냥 성공: 대피소에서 나와 사냥꾼 둘레에서 환호
  function celebrateVillager(n, dt) {
    if (n.fix) {      // 복구 박자: 무너진 집 앞으로 가서 망치질
      if (n.path.length) { n.act = 'none'; n.look = null; followPath(n, n.S.WALK * CB.WALK_K, dt); }
      else { stand(n, dt); n.act = 'hammer'; n.look = n.fix.look; }
      return;
    }
    if (!n.cheer) {   // 나와서 사냥꾼 쪽으로 몇 걸음만 다가가 환호 (멀면 끝까지 가지 않음)
      dv.set(PS.pos.x - n.pos.x, 0, PS.pos.z - n.pos.z);
      const d = dv.length() || 1, step = clamp(d - R(CB.RING_R), 0, CB.APPROACH), side = (cheerK++ % 2 ? 1 : -1) * R([0, CB.SPREAD]);
      dv.divideScalar(d);
      n.cheer = n.pos.clone().addScaledVector(dv, step).add(_v.set(-dv.z * side, 0, dv.x * side));
      n.path = [n.cheer];
    }
    n.look = n.lookV.copy(PS.pos);
    if (n.path.length) { n.act = 'none'; followPath(n, n.S.WALK * CB.WALK_K, dt); }
    else { stand(n, dt); n.act = 'cheer'; }
  }
  // 마지막 단계 클리어: 모두 성문 밖 앞에 줄지어 서서 바깥(새벽·카메라)을 보고 환호
  function endingVillager(n, dt) {
    if (!n.cheer) { n.cheer = n.endSpot.clone(); n.path = route(n.pos, n.cheer); }
    n.look = n.lookV.copy(n.endSpot).addScaledVector(poi.gateOut, 10);
    if (n.path.length) { n.act = 'none'; followPath(n, n.S.RUN, dt); }
    else { stand(n, dt); n.act = 'cheer'; }
  }
  // 성문 바깥 앞에 몇 줄로 (줄마다 PER_ROW명, 뒤 줄은 성문 쪽으로)
  function endingSpots(count) {
    const E = NS.ENDING, out = poi.gateOut, right = new THREE.Vector3(-out.z, 0, out.x), c = poi.gate.clone().addScaledVector(out, E.FRONT), spots = [];
    for (let j = 0; j < count; j++) {
      const row = Math.floor(j / E.PER_ROW), inRow = Math.min(E.PER_ROW, count - row * E.PER_ROW), col = (j % E.PER_ROW) - (inRow - 1) / 2;
      spots.push(c.clone().addScaledVector(right, col * E.COL).addScaledVector(out, -row * E.ROW));
    }
    return spots;
  }

  function think(n, dt) {
    n.actT += dt;
    n.startle = Math.max(0, n.startle - dt);
    if (n.hidden) { if ((mode === 'celebrate' || mode === 'ending') && sysT >= n.emergeAt) emerge(n); else return; }
    if (dangerAway(n, dv)) {                  // 밟히지 않게 최우선으로 피한다
      dv.normalize().multiplyScalar(n.S.RUN);
      n.vel.lerp(dv, 1 - Math.exp(-C.ACCEL * 2 * dt));
      n.act = n.villager ? 'panic' : n.S.PANIC_ACT; n.look = null;
    } else if (n.villager && n.startle > 0) { // 건물이 무너지면 놀라서 멈춤
      stand(n, dt); n.act = 'panic'; n.look = n.startleAt;
    } else if (mode === 'normal') (n.villager ? routine : animalRoutine)(n, dt);
    else if (mode === 'crisis') (n.villager ? crisisVillager : crisisAnimal)(n, dt);
    else if (mode === 'ending') (n.villager ? endingVillager : animalRoutine)(n, dt);
    else (n.villager ? celebrateVillager : animalRoutine)(n, dt);

    n.pos.addScaledVector(n.vel, dt);
    solve(n);
    const sp = Math.hypot(n.vel.x, n.vel.z);
    let want = null;
    if (sp > C.TURN_MIN) want = Math.atan2(n.vel.x, n.vel.z);
    else if (n.look) want = Math.atan2(n.look.x - n.pos.x, n.look.z - n.pos.z);
    if (want !== null) n.yaw += wrapAngle(want - n.yaw) * (1 - Math.exp(-C.TURN * dt));
    n.phase += sp * n.S.STRIDE * dt;
    n.walk = damp(n.walk, clamp(sp / n.S.WALK, 0, C.WALK_MAX), C.WALK_RATE, dt);
  }

  function separate() {
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (a.hidden) continue;
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j];
        if (b.hidden) continue;
        const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), m = a.S.RADIUS + b.S.RADIUS + C.SEP_PAD;
        if (d < m && d > 1e-4) {
          const k = (m - d) / d * 0.5;
          a.pos.x -= dx * k; a.pos.z -= dz * k; b.pos.x += dx * k; b.pos.z += dz * k;
          a.dirty = b.dirty = true;
        }
      }
      const dx = a.pos.x - PS.pos.x, dz = a.pos.z - PS.pos.z, d = Math.hypot(dx, dz), m = a.S.RADIUS + C.PLAYER_SEP;
      if (d < m && d > 1e-4) { a.pos.x = PS.pos.x + dx / d * m; a.pos.z = PS.pos.z + dz / d * m; a.dirty = true; }
      if (a.pen) clampPen(a.area, a.pos);
    }
  }
  function write(n) {
    const g = n.grp;
    if (n.hidden) g.mesh.setMatrixAt(n.idx, ZERO_M);
    else g.mesh.setMatrixAt(n.idx, _m.compose(_v.set(n.pos.x, 0, n.pos.z), _q.setFromAxisAngle(UP, n.yaw), ONE));
    g.anim.setXYZW(n.idx, n.phase, n.walk, ACT[n.act] ?? 0, n.actT);
    g.look.setXY(n.idx, n.mask, n.face);
    g.dirty = true;
  }

  // 모델마다 메시 하나 (자원 주민은 농부 메시 안의 인스턴스) + 예산 안에서 개체 생성
  const byModel = new Map();   // 모델 → [역할, 역할, …] (인스턴스 순서)
  for (const [role, cnt] of Object.entries(comp.pop)) {
    const m = NS.ROLE_MODEL[role] || role;
    if (!byModel.has(m)) byModel.set(m, []);
    for (let i = 0; i < cnt; i++) byModel.get(m).push(role);
  }
  const lookOf = (role, i) => {   // 역할 i번째의 파츠 마스크·표정
    const L = SD.LOOK[role] || {}, bits = (ps) => (ps || []).reduce((a, p) => a + 2 ** (NPC_PARTS[p].BIT - 1), 0);
    const bh = L.bandHead || 0, ba = L.bandArm || 0;
    let mask = bits(L.parts) + (i < (L.alt?.n || 0) ? bits(L.alt.parts) : 0);
    if (i < bh) mask += 2 ** (NPC_PARTS.bandHead.BIT - 1); else if (i < bh + ba) mask += 2 ** (NPC_PARTS.bandArm.BIT - 1);
    return { mask, face: Math.max(0, NPC_FACE_KEYS.indexOf(L.face || 'smile')) };
  };
  const roleK = {};
  for (const [name, roles] of byModel) {
    const S = C.SPECIES[name], villager = S.kind === 'villager', want = roles.length;
    const n = clamp(want, 0, villager ? B.VILLAGERS - vill : B.LIVESTOCK - live);
    if (n < want) console.warn(`[NPC_BUDGET] ${name} ${want} → ${n} (${villager ? '주민' : '가축'} 예산 초과)`);
    if (!n) continue;
    if (villager) vill += n; else live += n;
    const pen = villager ? null : pens.find((p) => p.species.includes(name));
    if (!villager && !pen) { console.warn(`[NPC] ${name}: 들어갈 목장이 없어 생략`); continue; }
    const geo = buildNPCGeometry(name, VOXEL_MODELS[name]);
    const anim = new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4);
    anim.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('aAnim', anim);
    const look = new THREE.InstancedBufferAttribute(new Float32Array(n * 2), 2);   // 파츠 마스크 · 표정 (인스턴스마다)
    look.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('aLook', look);
    const uniforms = { uAmp: { value: new THREE.Vector4(S.LEG, S.ARM, S.BOB, S.TAIL) } };
    const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
    const depth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });   // 그림자도 팔다리가 움직이게
    injectNPCAnim(mat, uniforms); injectNPCAnim(depth, uniforms);
    const mesh = new THREE.InstancedMesh(geo, mat, n);
    mesh.customDepthMaterial = depth;
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.castShadow = C.CAST_SHADOW; mesh.receiveShadow = true; mesh.frustumCulled = false;
    world.add(mesh);
    const grp = { name, mesh, anim, look, dirty: true, visible: 0, total: n, villager };
    groups.push(grp);
    const area = pen ? penArea(pen, SD.PEN_K ?? 1) : null;
    for (let i = 0; i < n; i++) {
      const role = roles[i], ri = roleK[role] = (roleK[role] ?? -1) + 1, lk = villager ? lookOf(role, ri) : { mask: 0, face: 0 };
      mesh.setColorAt(i, _c.setScalar(1 - rand() * C.INSTANCE_TINT));
      const npc = { name, S, villager, role, grp, idx: i, pen, area, pos: new THREE.Vector3(), vel: new THREE.Vector3(),
        yaw: rand() * Math.PI * 2, state: 'idle', t: 0, dur: R(S.IDLE), act: 'none', actT: rand() * 10, phase: 0, walk: 0,
        path: [], walkT: 0, task: Math.floor(rand() * 3), taskAct: 'none', taskLook: null, taskPlace: '', legs: 0, look: null, lookV: new THREE.Vector3(),
        tasks: SD.TASKS[role] || NS.DEFAULT_TASKS[role] || S.TASKS, mask: lk.mask, face: lk.face, face0: lk.face,
        spot: NS.DEFENDERS.includes(role) ? guardK++ : 0, hidden: false, refuge: null, startle: 0, startleAt: null, emergeAt: 0,
        cheer: null, fix: null, endSpot: null, fleeT: 0, acc: 0, onScreen: true, dirty: true };
      if (pen) randPen(area, npc.pos);
      else if (NS.DEFENDERS.includes(role) && poi.gateSpots.length) npc.pos.copy(poi.gateSpots[npc.spot % poi.gateSpots.length]);
      else npc.pos.copy(randPlaza());
      solve(npc);
      list.push(npc);
    }
  }
  // 처음부터 대피소 안에 있는 주민 (상인·아이 — 단계가 오를수록 늘어남). 클리어하면 나와서 환호
  const shelter = houses.find((h) => h.kind === 'shelter' && h.alive);
  let sheltered = 0;
  for (const [role, k] of Object.entries(SD.SHELTERED || {})) {
    for (const n of list.filter((x) => x.role === role).slice(0, k)) {
      if (!shelter || shelter.occupants.size >= (shelter.capacity ?? Infinity)) break;
      hide(n, shelter); n.dirty = true; sheltered++;
    }
  }
  const roleText = Object.entries(comp.pop).filter(([, k]) => k).map(([r, k]) => `${NS.ROLE_LABEL[r] || r} ${k}`).join(' · ');
  gameLog('NPC', `${stageId}단계 주민 ${vill}/${B.VILLAGERS}(마을 Lv${level} ${comp.cap.villagers}) + 가축 ${live}/${B.LIVESTOCK}(${comp.cap.livestock}) · ` +
    `${roleText} · 대피소 안 ${sheltered} · 우리 ${Math.round((SD.PEN_K ?? 1) * 100)}%${comp.trimmed.length ? ` · 줄임: ${comp.trimmed.join(',')}` : ''} · 종 ${groups.length}개 = draw call ${groups.length} (+그림자)`);

  return {
    list,
    update(dt) {
      sysT += dt;
      const next = endingOn ? 'ending' : game.over && game.result ? 'celebrate' : (seq.dread > CR.DREAD_START || MS.state !== 'hidden') ? 'crisis' : 'normal';
      if (next !== mode) {
        mode = next;
        const villagers = list.filter((n) => n.villager), spots = mode === 'ending' ? endingSpots(villagers.length) : null;
        for (const n of list) {
          n.path = []; n.state = 'idle'; n.t = 0; n.dur = 0; n.act = 'none'; n.cheer = null; n.fix = null; n.fleeT = 0;
          if (mode === 'celebrate') n.emergeAt = sysT + CB.EMERGE_DELAY + Math.random() * CB.EMERGE_SPREAD;
          if (mode === 'ending') n.emergeAt = sysT + Math.random() * CB.EMERGE_SPREAD * 0.5;
          if (n.villager && (mode === 'celebrate' || mode === 'ending')) { n.face = NPC_FACE_KEYS.indexOf('joy'); n.dirty = true; }   // 모두 큰 웃음
        }

    if (!b.width || b.bottom < 0 || b.top > vh) return;   // 접혔거나 화면 밖이면 건너뜀
    for (const o of pv.items) o.model.root.visible = o.model === it.model;
    it.model.root.rotation.y = t * JOB_PREVIEW.SPIN + (it.phase ?? i * JOB_PREVIEW.PHASE);

  const out = rows.map(([name, x, y, f]) => {
    const d = y - x, cls = Math.abs(d) < 1e-6 ? 'same' : d > 0 ? 'up' : 'down';
    return `<span class="cmp ${cls}">${name} ${f(x)} → <b>${f(y)}</b>${cls === 'same' ? '' : ` ${cls === 'up' ? '▲' : '▼'}`}</span>`;
  });
  const ca = a.charm ? Progress.itemStats(a.charm).text : S.NONE, cb = b.charm ? Progress.itemStats(b.charm).text : S.NONE;
  if (ca !== cb) out.push(`<span class="cmp up">${S.CMP_CHARM(ca, cb)}</span>`);
  return `<div class="cmps">${out.join('')}</div>`;
}
// 장착 전후 블록: 지금 → 장착 후 사냥꾼 미리보기 + 능력치 비교 (캔버스는 카드를 붙인 뒤 attachCompare로 모델 연결)
const COMPARE_SIZE = () => Math.round(JOB_PREVIEW.SIZE * JOB_PREVIEW.COMPARE_K);
function compareHTML(key, a, b) {
  const S = T.SMITHY;
  return `<div class="cmpbox"><div class="pvpair"><figure>${pvCanvasHTML(`data-pv="${key}:now"`, COMPARE_SIZE())}<figcaption>${S.CMP_NOW}</figcaption></figure>` +
    `<span class="arrow" aria-hidden="true">→</span><figure>${pvCanvasHTML(`data-pv="${key}:after"`, COMPARE_SIZE())}<figcaption>${S.CMP_AFTER}</figcaption></figure></div>${statCompareHTML(a, b)}</div>`;
}
function attachCompare(root, key, nowModel, after) {
  pvAdd('smithy', root.querySelector(`canvas[data-pv="${key}:now"]`), nowModel, 0);
  pvAdd('smithy', root.querySelector(`canvas[data-pv="${key}:after"]`), pvModel(save.hunter.job, after.gr), 0);
}
function lookText(slot, g) {
  const L = EQUIPMENT.LOOK, S = T.SMITHY;
  if (slot === 'weapon') return L.BLADE_ADD[g - 1] ? S.LOOK_WEAPON(L.BLADE_ADD[g - 1], EQUIPMENT.GRADES[g].name) : S.LOOK_BASE;
  if (slot === 'charm') return S.LOOK_CHARM(g >= L.CHARM.HIGH_FROM ? L.CHARM.HIGH[0][3] - L.CHARM.HIGH[0][2] + 1 : 1);
  return L.PARTS[slot][g - 1] + (slot === 'body' && L.SHOULDER[g] ? S.LOOK_SHOULDER : '');
}

// 제작·강화 성공 연출: 카드 + 불꽃 + 화면 번쩍 + 망치 소리 (iconHtml: 복셀 아이콘)
//   opt.model: 새 장비를 걸친 사냥꾼이 카드 안에서 돈다 · opt.diff: 능력치 비교 HTML (FORGE_FX)
function forgeFx(iconHtml, title, sub, kind, opt = {}) {
  const FX = FORGE_FX;
  audioUnlock(); sfx.forge(kind);
  pvClear('forge');
  $('ff-ic').innerHTML = opt.model ? pvCanvasHTML('id="ff-cv" role="img"', FX.PREVIEW) + `<span class="ff-badge">${iconHtml}</span>` : iconHtml;
  if (opt.model) pvAdd('forge', $('ff-cv'), opt.model, 0);
  $('ff-title').textContent = title; $('ff-sub').textContent = sub;
  $('ff-diff').innerHTML = opt.diff || '';
  const f = $('forge-fx');
  f.classList.toggle('big', !!opt.model);
  f.style.setProperty('--ff-ms', `${FX.HOLD_MS}ms`);
  f.querySelectorAll('i').forEach((x) => x.remove());
  for (let i = 0; i < FX.SPARKS; i++) {
    const s = document.createElement('i'), a = Math.random() * Math.PI * 2, r = FX.SPARK_R[0] + Math.random() * (FX.SPARK_R[1] - FX.SPARK_R[0]);
    s.style.cssText = `--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r - FX.SPARK_UP}px;--d:${(Math.random() * FX.SPARK_DELAY).toFixed(2)}s;background:${FX.SPARK_COLORS[i % FX.SPARK_COLORS.length]}`;
    f.appendChild(s);
  }
  for (const el of [f, $('forge-flash')]) { el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
  clearTimeout(forgeFx.timer);
  forgeFx.timer = setTimeout(() => pvClear('forge'), FX.HOLD_MS);
}

// 몬스터를 화면에 맞추는 카메라 (경계 상자 기준)

    const ctx = (fwd) => ({ root: new THREE.Vector3(), fwd, y: 0, mode: 'stand', move: 0, dt: 1 / 60, time: 0, pose, hunter: new THREE.Vector3(0, 1, 30) });

// 한 종씩 다음 틈에 그린다 (도감을 열자마자 7종을 한꺼번에 만들지 않게)
function bookQueue(key, known) {
  const id = `${key}:${known ? 1 : 0}`;
  if (bookArt.has(id) || bookView.queue.some((q) => q.id === id)) return;
  bookView.queue.push({ id, key, known });

function bookPump() {

  setTimeout(() => {
    bookArt.set(q.id, bookMakeArt(q.key, q.known));
    bookFillMap(q.key);
    bookPump();

}
function bookLoop(now) {

// 약점 배율 → 점 색 (MULT_COLORS 사이를 섞음)
function multColor(m) {

  for (let i = 1; i < S.length; i++) if (m <= S[i][0]) return '#' + new THREE.Color(S[i - 1][1]).lerp(new THREE.Color(S[i][1]), (m - S[i - 1][0]) / (S[i][0] - S[i - 1][0])).getHexString();

// 같은 계열 부위 묶기: 종류·배율·드롭이 같으면 한 묶음. 이름은 왼/오른을 뺀 공통 끝(없으면 공통 앞, 그것도 짧으면 종류 이름)

    if (!groups.has(gk)) groups.set(gk, { gk, ids: [], kind: p.kind, mult: p.mult, drop: p.drop, hidden: !!p.hidden, names: [] });
    const g = groups.get(gk); g.ids.push(pid); g.names.push(p.name.replace(SIDE_WORDS, ''));
  }

    return s.trim();

  }

// 점 배치: 같은 묶음끼리 가까우면 하나로 합치고(숫자), 남은 점은 서로 DOT_GAP 이상 떨어지게 밀어낸다 (터치 영역 겹침 방지)

  for (let merged = true; merged;) {
    merged = false;
    for (let i = 0; i < items.length && !merged; i++) for (let j = i + 1; j < items.length && !merged; j++) {
      const a = items[i], b = items[j];
      if (a.g !== b.g || Math.hypot(a.x - b.x, a.y - b.y) >= B.DOT_MERGE) continue;
      const na = a.ids.length, nb = b.ids.length;
      items[i] = { ids: [...a.ids, ...b.ids], g: a.g, x: (a.x * na + b.x * nb) / (na + nb), y: (a.y * na + b.y * nb) / (na + nb) };
      items.splice(j, 1); merged = true;
    }
  }
  for (let it = 0; it < B.DOT_RELAX; it++) {
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const a = items[i], b = items[j], dx = b.x - a.x, dy = b.y - a.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) >= B.DOT_GAP) continue;   // 터치 영역은 정사각형이라 가로·세로 중 한쪽만 벌어지면 안 겹침
      const ax = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y', d = ax === 'x' ? dx : dy, sign = d < 0 ? -1 : 1;   // 더 벌어진 축으로 민다 (같은 자리면 오른쪽)
      const push = (B.DOT_GAP - Math.abs(d)) / 2;
      a[ax] -= sign * push; b[ax] += sign * push;
    }
    for (const a of items) { a.x = Math.min(size - half, Math.max(half, a.x)); a.y = Math.min(size - half, Math.max(half, a.y)); }
  }
  return items.map((a) => ({ ...a, x: a.x / size * 100, y: a.y / size * 100 }));
}

const peek = { on: false, w: 0, target: new THREE.Vector3() };
function peekFrame(now) {
  if (!peek.on) return;
  requestAnimationFrame(peekFrame);
  const P = CONFIG.CAMERA.PEEK;
  hunter.root.position.copy(PS.pos); hunter.root.rotation.y = PS.yaw + now / 1000 * P.SPIN;
  const pitch = THREE.MathUtils.degToRad(P.PITCH_DEG);
  cam.dir.set(Math.cos(pitch) * Math.sin(camYaw), Math.sin(pitch), Math.cos(pitch) * Math.cos(camYaw));
  cam.w = P.VIEW_W; cam.d = fitDistance(cam.w);
  cam.target.copy(PS.pos).setY(P.TARGET_Y);
  camera.position.copy(cam.target).addScaledVector(cam.dir, cam.d); camera.lookAt(cam.target);
  camera.near = Math.max(cam.d * CONFIG.CAMERA.NEAR_K, cam.d - P.CLIP_FRONT); camera.far = cam.d * CONFIG.CAMERA.FAR_K; camera.updateProjectionMatrix();
  scene.fog.near = cam.d * LIGHT_CONFIG.FOG.NEAR_K; scene.fog.far = cam.d * LIGHT_CONFIG.FOG.FAR_K_CALM;
  sky.position.copy(camera.position); sky.scale.setScalar(camera.far * 0.9);
  _v.copy(cam.target); world.localToWorld(_v).project(camera);
  post.uniforms.uFocusY.value = clamp(_v.y * 0.5 + 0.5, 0, 1);
  render();
}

const AUDIT_CONFIG = { SIZE_TOL: 0.12 };   // 실측 높이가 목표에서 이 비율보다 벗어나면 경고
async function runMonsterAudit() {
  const M = MONSTER_CONFIG, H = CONFIG.SCALE.HOUSE_HEIGHT, hex = (c) => '#' + c.toString(16).padStart(6, '0');
  const keep = { PARTS: M.PARTS, COLOR: M.COLOR, EYE_COLOR: M.EYE_COLOR, url: M.SLOT.url, partBones: M.SLOT.partBones, stage: game.stage, sizeK: MS.sizeK, parts: MS.parts };
  const rows = [], warns = [];

    const s = Progress.resolveStage(st.id);
    s.eye = stageEyeColor(s, 0);
    // applyStage 중 몬스터 생성에 필요한 부분만 (MONSTER_CONFIG 치수는 바꾸지 않음 → 여러 번 돌려도 안전)
    game.stage = s; MS.sizeK = (s.sizeK * H) / M.BASE_HEIGHT; M.COLOR = s.color; M.EYE_COLOR = [...s.eye];
    M.PARTS = Object.fromEntries(Object.entries(s.parts).map(([pid, p]) => [pid, { ...p, color: MATERIALS[p.drop].color }]));
    MS.parts = Object.fromEntries(Object.keys(M.PARTS).map((pid) => [pid, { hp: M.PARTS[pid].hp, broken: false }]));
    M.SLOT.url = s.model || null;
    M.SLOT.partBones = Object.fromEntries(Object.keys(s.parts).map((id) => [id, M.SLOT.WEAK_BONE_PREFIX + id]));
    const m = await createMonster();
    let measured = m.fit?.measured;
    if (!measured) { m.group.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(m.group); measured = b.max.y - Math.max(0, b.min.y); }
    const L = game.monsterLoad || {};

      단계: st.id, monsterId: s.monsterId, 이름: s.species.name,
      모델: L.source === 'glb' ? `GLB ${L.url}` : `폴백 (${L.reason})`, 모델경로: s.model || null,
      외형: m.kind, 체형: s.body, 몸색: hex(s.color), 눈색: s.eye.join(','),
      크기목표: s.sizeK, 크기실측: +ratio.toFixed(2), 맞춤: m.fit ? +m.fit.fitK.toFixed(2) : 1, 삼각형: m.tris,
      디테일: m.detail ? `${m.detail.level} · 파츠 ${m.detail.parts} · ${m.detail.tex}` : '-',
      파츠수: m.detail ? m.detail.parts : 0,
      ...(({ limbs, ratio, parts, gimmick }) => ({ 팔다리: limbs, 몸통비율: ratio, 파츠구성: parts, 기믹: gimmick }))(stageMonsterSig(st)),
      약점: Object.entries(s.parts).map(([id, p]) => `${p.name}(${id} ×${p.mult}${p.hidden ? ', 숨김' : ''})`).join(' · '),
      패턴: s.species.PATTERNS.map((p) => `${p.name}[${p.proto === 'slam' ? '내려찍기' : p.proto === 'charge' ? '돌진' : p.gimmick ? '기믹' : '미구현'}]`).join(' · ') + ` · 기믹: ${s.gimmick.name}`,
    });

  warns.push(...auditWarnings(rows));
  console.info(`[AUDIT] 단계 ${rows.length}개 몬스터 점검 — 경고 ${warns.length}`);
  console.table(rows.map(({ 모델경로, ...r }) => r));

}
// 중복·순서 검사 (같은 monsterId·모델 파일·외형·체형·색·눈 색, 크기 역전·목표와 차이)
function auditWarnings(rows) {
  const warns = [];
  const dup = (label, key) => {
    const seen = {};
    for (const r of rows) { const v = key(r); if (v == null) continue; (seen[v] = seen[v] || []).push(r.단계); }
    for (const [v, ids] of Object.entries(seen)) if (ids.length > 1) warns.push(`${label} 중복: ${ids.join('·')}단계가 같은 ${label} (${v})`);
  };
  dup('monsterId', (r) => r.monsterId);
  dup('모델 파일', (r) => r.모델경로);
  dup('외형(체형+몸색+눈색)', (r) => `${r.체형}|${r.몸색}|${r.눈색}`);
  dup('체형', (r) => r.체형);
  dup('몸 색', (r) => r.몸색);
  dup('눈 색', (r) => r.눈색);
  dup('팔다리 구성', (r) => r.팔다리);
  dup('몸통 비율', (r) => r.몸통비율);
  dup('파츠 구성', (r) => r.파츠구성);
  dup('기믹', (r) => r.기믹);
  dup('삼각형 수(같은 도형 의심)', (r) => r.삼각형);
  rows.forEach((r, i) => {
    if (i && r.크기실측 <= rows[i - 1].크기실측) warns.push(`크기 역전: ${r.단계}단계 실측 ${r.크기실측}배 ≤ ${rows[i - 1].단계}단계 ${rows[i - 1].크기실측}배`);
    if (Math.abs(r.크기실측 / r.크기목표 - 1) > AUDIT_CONFIG.SIZE_TOL) warns.push(`크기 차이: ${r.단계}단계 실측 ${r.크기실측}배 / 목표 ${r.크기목표}배`);
    if (i && r.파츠수 <= rows[i - 1].파츠수) warns.push(`파츠 수: ${r.단계}단계 ${r.파츠수}개 ≤ ${rows[i - 1].단계}단계 ${rows[i - 1].파츠수}개 (단계마다 늘어야 함)`);
    if (r.삼각형 > MONSTER_CONFIG.SLOT.MAX_TRIS) warns.push(`삼각형 초과: ${r.단계}단계 ${r.삼각형} > ${MONSTER_CONFIG.SLOT.MAX_TRIS}`);
  });
  return warns;
}
function renderMonsterAudit(rows, warns) {

    `<div class="sc"><table><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr>${rows.map((r) => `<tr>${cols.map((c) =>
      `<td${c === '몸색' ? ` style="box-shadow:inset 6px 0 0 ${r[c]}"` : ''}>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</table></div>` +
    `<p><button id="audit-exit">게임으로</button></p>`;
  const css = document.createElement('style');
  css.textContent = `#audit{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);color:var(--ink);padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 24px);font-size:12px;line-height:1.5}
    #audit h1{font-size:18px;margin:0 0 4px}#audit h2{font-size:15px;margin:14px 0 6px}#audit .m{color:var(--ink-dim);margin:0}
    #audit .w{padding:6px 10px;border-left:3px solid #ffcf70;background:#141a22;margin-bottom:4px}#audit .ok{padding:6px 10px;border-left:3px solid #a8e08a;background:#141a22}
    #audit .sc{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:8px}#audit table{border-collapse:collapse;min-width:1100px}
    #audit th,#audit td{padding:6px 8px;border-bottom:1px solid #f3e6cf1a;text-align:left;vertical-align:top}#audit th{position:sticky;top:0;background:#181d25;color:var(--ink-dim)}

    #audit button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#141a22;color:inherit;font:inherit}`;
  document.head.appendChild(css); document.body.appendChild(el);
  $('audit-exit').onclick = () => { const u = new URL(location.href); u.searchParams.delete('audit'); location.href = u.toString(); };
}

// ============================================================
// ?village=1~7: 단계별 마을 미리보기 — 사냥 없이 그 단계 마을 · 마을 레벨 시설 · 무너졌던 집을 보고, 전환 연출을 다시 본다
//   &vlv=1~5 마을 레벨 (기본 VILLAGE_LOOK.PREVIEW_LEVEL) · &repair=0~10 무너졌던 집 수 (기본 PREVIEW_REPAIRS). 저장은 읽기만 한다
// ============================================================
function runVillagePreview() {
  const V = VILLAGE_LOOK, N = Object.keys(VILLAGE_STAGES).length, O = STAGE_INTRO.ORBIT, F = LIGHT_CONFIG.FOG, VB = VOXEL_BUDGET;
  const st = { id: clamp(parseInt(PARAMS.get('village'), 10) || 1, 1, N) };
  st.level = clamp(parseInt(PARAMS.get('vlv'), 10) || V.PREVIEW_LEVEL[st.id - 1], 1, 5);
  st.repairs = clamp(PARAMS.has('repair') ? parseInt(PARAMS.get('repair'), 10) || 0 : V.PREVIEW_REPAIRS, 0, CONFIG.VILLAGE.HOUSES - 1);
  monster = { group: { visible: false }, feet: [], materials: [] };   // 주민 AI·렌더가 보는 몬스터 자리 (미리보기엔 몬스터 없음)
  $('hint').hidden = true;
  bindNpcTap();
  let rep = [];
  const makeNPCs = () => {   // 단계·마을 레벨이 바뀌면 주민·가축을 그 단계 구성으로 다시 만든다
    if (npcs) npcs.dispose();
    npcs = NPC_OFF ? null : createNPCs(st.id, st.level, { dead: () => rep, onRepairBeat: () => {} });
    game.over = false; game.result = null; ENDING.active = false; $('ending').style.opacity = 0;
    for (const t of trees) if (t.hide) { t.hide = false; updateTreeMatrices(t); }
  };
  const staticCount = world.children.find((o) => o.isInstancedMesh && o.userData.staticVillage)?.count || 0;

  const el = document.createElement('div');
  el.id = 'vprev';
  el.innerHTML = `<button class="t" data-a="min">🏘 마을 미리보기</button><div class="body"><div id="vp-info"></div>
    <div class="row"><button data-a="id-" aria-label="앞 단계">◀</button><span id="vp-id"></span><button data-a="id+" aria-label="다음 단계">▶</button></div>
    <div class="row"><button data-a="lv-" aria-label="마을 레벨 내리기">−</button><span id="vp-lv"></span><button data-a="lv+" aria-label="마을 레벨 올리기">＋</button></div>
    <div class="row"><button data-a="rp-" aria-label="무너졌던 집 줄이기">−</button><span id="vp-rp"></span><button data-a="rp+" aria-label="무너졌던 집 늘리기">＋</button></div>
    <div class="row"><button data-a="intro">전환 연출 보기</button><button data-a="exit">게임으로</button></div>
    <div class="row"><button data-a="cheer">클리어 환호</button><button data-a="ending">엔딩 컷</button><button data-a="reset">처음</button></div><div id="vp-npc"></div><div id="vp-stat"></div></div>`;
  const css = document.createElement('style');
  css.textContent = `#vprev{position:fixed;z-index:20;left:12px;top:calc(var(--safe-t) + 12px);width:min(320px,calc(100% - 24px));padding:8px 12px 10px;border-radius:12px;
      background:#10141ae0;border:1px solid var(--line);color:var(--ink);font-size:12px;line-height:1.5}
    #vprev.min .body{display:none}#vprev .t{all:unset;cursor:pointer;font-weight:800;font-size:14px;min-height:32px;display:block}
    #vprev .row{display:flex;gap:8px;align-items:center;margin-top:6px}#vprev .row span{flex:1;text-align:center;font-weight:700}
    #vprev .row button{min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#141a22;color:inherit;font:inherit}
    #vprev .row button:only-child,#vprev .row button[data-a=intro],#vprev .row button[data-a=exit]{flex:1}
    #vprev #vp-stat{margin-top:8px;color:var(--ink-dim)}#vprev .ok{color:#a8e08a}#vprev .bad{color:#ff9a7a}`;
  document.head.appendChild(css); document.body.appendChild(el);

  const rebuild = (intro) => {
    VS.towers = towerSpots(Progress.villageStats(save, st.level).towers).map((p) => ({ pos: new THREE.Vector3(p.x, COMBAT_CONFIG.TOWER.FIRE_Y, p.z), t: 0 }));
    rep = houses.map((h, i) => i).filter((i) => houses[i].kind !== 'shelter').slice(0, st.repairs);
    buildStageVillage(st.id, st.level, rep);
    svCalmLighting();
    makeNPCs();
    const C = npcComposition(st.id, st.level);
    $('vp-npc').textContent = NPC_OFF ? '주민·가축 끔 (?npc=0)' : `주민·가축: ${Object.entries(C.pop).filter(([, k]) => k).map(([r, k]) => `${NPC_STAGE_CONFIG.ROLE_LABEL[r] || r} ${k}`).join(' · ')}` +
      ` · 대피소 안 ${Object.values(C.D.SHELTERED).reduce((a, b) => a + b, 0)} · 주민을 누르면 대사`;
    if (intro) startStageIntro(st.id, rep.length);
    const D = VILLAGE_STAGES[st.id];
    $('vp-info').textContent = `${D.DAY}일째 · ${D.TIME} · ${V.WEATHER_LABEL[D.WEATHER]} — ${D.NOTE}`;
    $('vp-id').textContent = `${st.id}단계`;
    $('vp-lv').textContent = `마을 Lv${st.level} (성벽 ${V.WALL.BY_LEVEL[st.level - 1]?.KIND || '없음'} · 포탑 ${VS.towers.length})`;
    $('vp-rp').textContent = `무너졌던 집 ${st.repairs}채`;
    const u = new URL(location.href);
    u.searchParams.set('village', st.id); u.searchParams.set('vlv', st.level); u.searchParams.set('repair', st.repairs);
    history.replaceState(null, '', u);
  };
  el.addEventListener('click', (e) => {
    const a = e.target.closest('button')?.dataset.a;
    if (!a) return;
    if (a === 'min') { el.classList.toggle('min'); return; }
    if (a === 'exit') { const u = new URL(location.href); for (const k of ['village', 'vlv', 'repair']) u.searchParams.delete(k); location.href = u.toString(); return; }
    if (a === 'intro') { firstGesture(); rebuild(true); return; }
    if (a === 'cheer') { firstGesture(); makeNPCs(); game.over = true; game.result = true; return; }   // 클리어 환호 + 복구 박자
    if (a === 'ending') { firstGesture(); makeNPCs(); game.over = true; game.result = true; startEnding(); return; }
    if (a === 'reset') { makeNPCs(); return; }
    if (a === 'id-' || a === 'id+') { st.id = clamp(st.id + (a === 'id+' ? 1 : -1), 1, N); st.level = V.PREVIEW_LEVEL[st.id - 1]; }
    if (a === 'lv-' || a === 'lv+') st.level = clamp(st.level + (a === 'lv+' ? 1 : -1), 1, 5);
    if (a === 'rp-' || a === 'rp+') st.repairs = clamp(st.repairs + (a === 'rp+' ? 1 : -1), 0, CONFIG.VILLAGE.HOUSES - 1);
    rebuild(false);
  });
  canvas.addEventListener('pointerdown', skipStageIntro);
  window.addEventListener('resize', resize);   // 화면 회전·창 크기 (숨은 창에서 열려도 보일 때 다시 맞춤)
  resize();
  rebuild(true);

  let last = performance.now(), ang = camYaw, statT = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    tick(Math.min((now - last) / 1000, CONFIG.QUALITY.DT_MAX));
    last = now;
  }
  // 콘솔 확인용: 화면이 숨어 있어도(rAF 멈춤) 한 걸음씩 돌려 draw call·복셀을 잴 수 있게
  window.__vprev = { st, rebuild, npcs: () => npcs, screenOf: (p, y = 0.7) => { world.localToWorld(_v.set(p.x, y, p.z)).project(camera); return [(_v.x + 1) / 2 * innerWidth, (1 - _v.y) / 2 * innerHeight, _v.z]; }, free: (deg, r, rad) => svSpotFree(Math.cos(deg * Math.PI / 180) * r, Math.sin(deg * Math.PI / 180) * r, rad, []), step: (dt = 1 / 60, n = 1) => { for (let k = 0; k < n; k++) tick(dt); return { ...renderer.info.render, ...SV.count, skipped: SV.skipped, intro: INTRO.active }; } };
  function tick(dt) {
    clock += dt;
    if (npcs) npcs.update(dt);
    svUpdate(dt);
    if (ENDING.active) { updateCamera(dt, clock); endingCamera(dt); }
    else if (INTRO.active) {
      updateStageIntro(dt); updateCamera(dt, clock); introCamera();
      ang = INTRO.yaw0 + (INTRO.t / STAGE_INTRO.DURATION) * O.TURN * Math.PI * 2;
    } else {   // 천천히 마을을 돈다
      ang += dt * V.PREVIEW_ORBIT * Math.PI * 2;
      camera.position.set(Math.sin(ang) * O.R, O.H, Math.cos(ang) * O.R); camera.lookAt(0, O.LOOK_Y, 0);
      camera.near = O.R * CONFIG.CAMERA.NEAR_K; camera.far = O.R * CONFIG.CAMERA.FAR_K; camera.updateProjectionMatrix();
      sky.position.copy(camera.position); sky.scale.setScalar(camera.far * 0.9);
      scene.fog.near = O.R * F.NEAR_K; scene.fog.far = O.R * F.FAR_K_CALM * SV.tone.fogK;
    }
    render();
    if ((statT += dt) < CONFIG.QUALITY.FPS_UI_INTERVAL) return;
    statT = 0;
    const i = renderer.info.render, total = staticCount + houseMesh.count + treeMesh.count + SV.count.stage + SV.count.level;
    const tag = (n, max) => `<b class="${n > max ? 'bad' : 'ok'}">${n}</b>/${max}`;
    $('vp-stat').innerHTML = `draw ${tag(i.calls, VB.DRAW_CALLS)} (그림자 포함) · 삼각형 ${(i.triangles / 1000).toFixed(0)}k<br>` +
      `복셀 단계 ${tag(SV.count.stage, VB.STAGE)} · 레벨 ${tag(SV.count.level, VB.LEVEL)} · 불꽃 ${tag(SV.count.glow, VB.GLOW)}<br>마을 전체 ${tag(total, VB.TOTAL)}` +
      (SV.skipped.length ? `<br><span class="bad">생략: ${SV.skipped.join(', ')}</span>` : '');
  }
  requestAnimationFrame(loop);
}

// ============================================================
// ?villageaudit=1: 1단계부터 마지막 단계까지 마을 프리셋 + NPC 구성을 차례로 불러와 표로 —
//   오브젝트 수 · 주민·가축 수 · 복셀 · draw call(마을만 / 그 단계 몬스터 포함) · FPS(화면이 보일 때)·CPU ms
//   예산 초과와 '두 단계가 똑같아 보임'(설정 서명 비교 + 같은 자리 스크린샷 축소판 비교)을 경고하고,
//   스크린샷 reports/screens/stage-N.png · 표 reports/village-audit.{md,json}을 저장 (tools/report-server.py, 없으면 내려받기 링크)
//   &vlv=1~5 로 모든 단계를 같은 마을 레벨로. 사용자 저장은 읽기만 한다
// ============================================================
async function runVillageAudit() {
  const A = VILLAGE_AUDIT, V = VILLAGE_LOOK, VB = VOXEL_BUDGET, NS = NPC_STAGE_CONFIG, LC = LIGHT_CONFIG, M = MONSTER_CONFIG;
  const stub = monster = { group: { visible: false }, feet: [], materials: [] };   // 주민 AI·렌더가 보는 몬스터 자리
  $('hint').hidden = true;
  window.addEventListener('resize', resize); resize();
  const status = document.createElement('div');
  status.id = 'vaudit-status';
  status.style.cssText = 'position:fixed;z-index:20;left:12px;top:calc(var(--safe-t) + 12px);padding:8px 12px;border-radius:10px;background:#10141ae0;border:1px solid var(--line);font-size:13px';
  document.body.appendChild(status);
  const staticCount = world.children.find((o) => o.isInstancedMesh && o.userData.staticVillage)?.count || 0;
  const vlv = parseInt(PARAMS.get('vlv'), 10);
  const nap = () => new Promise((r) => setTimeout(r, 0));
  const frameWait = () => new Promise((r) => {   // true = 실제 화면 프레임, false = 시간 초과(화면이 숨음)
    let done = false;
    const fin = (ok) => { if (!done) { done = true; r(ok); } };
    requestAnimationFrame(() => fin(true)); setTimeout(() => fin(false), A.FRAME_TIMEOUT_MS);
  });
  const shotCam = () => {   // 단계마다 같은 자리에서 마을 전체를 본다
    const S = A.SHOT, a = THREE.MathUtils.degToRad(S.YAW_DEG), F = LC.FOG;
    camera.position.set(Math.sin(a) * S.R, S.H, Math.cos(a) * S.R); camera.lookAt(0, S.LOOK_Y, 0);
    camera.near = S.R * CONFIG.CAMERA.NEAR_K; camera.far = S.R * CONFIG.CAMERA.FAR_K; camera.updateProjectionMatrix();
    sky.position.copy(camera.position); sky.scale.setScalar(camera.far * 0.9);
    const d = camera.position.length();
    scene.fog.near = d * F.NEAR_K; scene.fog.far = d * F.FAR_K_CALM * SV.tone.fogK;
    post.uniforms.uFocusY.value = S.FOCUS_Y;
  };
  const capture = () => {   // render 바로 뒤 같은 작업 안에서 읽어야 한다 (preserveDrawingBuffer 없음)
    const src = renderer.domElement, w = Math.min(A.SHOT_W, src.width), h = Math.round(src.height * w / src.width);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(src, 0, 0, w, h);
    const t = document.createElement('canvas'); t.width = A.THUMB[0]; t.height = A.THUMB[1];
    const tx = t.getContext('2d'); tx.drawImage(src, 0, 0, t.width, t.height);
    return { cv, thumb: tx.getImageData(0, 0, t.width, t.height).data };
  };
  const tick = (dt) => { clock += dt; if (npcs) npcs.update(dt); svUpdate(dt); };
  // 그 단계 몬스터(임시 도형/GLB)를 마을에 세워 draw call만 재고 바로 해제 (MONSTER_CONFIG 치수는 바꾸지 않음 — ?audit=1과 같은 방식)
  async function monsterDrawCalls(id) {
    const s = Progress.resolveStage(id), H = CONFIG.SCALE.HOUSE_HEIGHT;
    const keep = { PARTS: M.PARTS, COLOR: M.COLOR, EYE_COLOR: M.EYE_COLOR, url: M.SLOT.url, partBones: M.SLOT.partBones, stage: game.stage, sizeK: MS.sizeK, parts: MS.parts };
    s.eye = stageEyeColor(s, 0);
    game.stage = s; MS.sizeK = (s.sizeK * H) / M.BASE_HEIGHT; M.COLOR = s.color; M.EYE_COLOR = [...s.eye];
    M.PARTS = Object.fromEntries(Object.entries(s.parts).map(([pid, p]) => [pid, { ...p, color: MATERIALS[p.drop].color }]));
    MS.parts = Object.fromEntries(Object.keys(M.PARTS).map((pid) => [pid, { hp: M.PARTS[pid].hp, broken: false }]));
    M.SLOT.url = s.model || null;
    M.SLOT.partBones = Object.fromEntries(Object.keys(s.parts).map((pid) => [pid, M.SLOT.WEAK_BONE_PREFIX + pid]));
    const m = await createMonster();
    world.add(m.group);
    MS.root.set(M.LAND_POS[0], 0, M.LAND_POS[1]);
    m.land(Object.assign(mctx, { mode: 'stand' })); m.update(mctx); m.group.visible = true;
    monster = m; shotCam(); render(); monster = stub;
    const calls = renderer.info.render.calls;
    world.remove(m.group);
    m.group.traverse((o) => { if (o.isMesh || o.isInstancedMesh) { o.geometry?.dispose(); if (o.isInstancedMesh) o.dispose(); } });
    for (const mat of m.materials) mat.dispose();
    Object.assign(M, { PARTS: keep.PARTS, COLOR: keep.COLOR, EYE_COLOR: keep.EYE_COLOR }); M.SLOT.url = keep.url; M.SLOT.partBones = keep.partBones;
    game.stage = keep.stage; MS.sizeK = keep.sizeK; MS.parts = keep.parts;
    return calls;
  }
  const saveFile = async (path, body) => {
    try { const r = await fetch(`${A.SAVE_URL}/save/${path}`, { method: 'POST', body }); return r.ok; } catch (e) { return false; }
  };
  // 설정 서명: 날씨 · 하늘 톤 · 오브젝트(종류:상태) · 장식 · 주민 구성 · 외형(파츠·표정)
  const signature = (id, comp, L) => {
    const D = VILLAGE_STAGES[id], T = D.TONE;
    return {
      날씨: D.WEATHER, 톤: [T.SUN_COLOR, T.SKY_TOP, T.SKY_HORIZON, T.HEMI_SKY].join(','),
      오브젝트: D.OBJECTS.map(([k, , , s]) => `${k}:${s}`).sort().join(','), 장식: D.DECOR.map(([k]) => k).sort().join(','),
      주민: Object.entries(comp.pop).filter(([, n]) => n).map(([r, n]) => `${r}${n}`).sort().join(','),
      외형: L.filter((n) => n.villager).map((n) => `${n.role}:${n.mask}/${n.face}`).sort().join(','),
    };
  };

  const rows = [], shots = [], warns = [];
  let hiddenSeen = false, savedAll = true;
  for (const st of STAGES.LIST) {
    const id = st.id, level = clamp(vlv || V.PREVIEW_LEVEL[id - 1], 1, 5), D = VILLAGE_STAGES[id];
    status.textContent = `마을 점검 ${id} / ${STAGES.LIST.length}단계…`;
    await nap();
    VS.towers = towerSpots(Progress.villageStats(save, level).towers).map((p) => ({ pos: new THREE.Vector3(p.x, COMBAT_CONFIG.TOWER.FIRE_Y, p.z), t: 0 }));
    const rep = houses.map((h, i) => i).filter((i) => houses[i].kind !== 'shelter').slice(0, A.REPAIRS);
    buildStageVillage(id, level, rep); svCalmLighting();
    if (npcs) npcs.dispose();
    npcs = NPC_OFF ? null : createNPCs(id, level, { dead: () => rep, onRepairBeat: () => {} });
    const comp = npcComposition(id, level), L = npcs ? npcs.list : [];
    for (let t = 0; t < A.SETTLE_S; t += A.SIM_DT) tick(A.SIM_DT);   // 주민이 일과로 흩어지게 (그리지 않고)
    shotCam(); render();
    const info = { ...renderer.info.render }, { cv, thumb } = capture();
    // FPS·CPU: 같은 자리에서 실제 프레임을 FPS_S초 (화면이 숨어 있으면 FPS는 '-')
    let frames = 0, cpu = 0, hidden = document.hidden;

    if (AT && AT.next) AT.next(frame); else requestAnimationFrame(frame);
    const rawDt = (now - last) / 1000; last = now;
    if (AT && AT.speed) {   // 테스트 봇: 고정 걸음(AT.DT)을 실제 시간 × 배속만큼 돌린다 (가상 시간)
      if (AT.paused) return;
      AT.acc = Math.min((AT.acc || 0) + rawDt * AT.speed, AT.DT * AT.MAX_STEPS);
      let n = 0;
      while (AT.acc >= AT.DT) { AT.acc -= AT.DT; stepSim(AT.DT); n++; }
      if (!n || now - (AT.lastRender || 0) < AT.RENDER_MS) return;
      AT.lastRender = now;
    } else stepSim(Math.min(rawDt, CONFIG.QUALITY.DT_MAX));
    updateHUD();
    updateSkillButtons();
    render();
    sampleQuality(rawDt);
    showFps(rawDt);
  }
  // 게임 1걸음 (평소엔 프레임마다 1번, 테스트 봇이면 배속만큼 여러 번)
  function stepSim(realDt) {
    clock += realDt;
    // 히트스톱: 게임 시간만 멈추고 카메라 흔들림·UI는 계속
    let dt = realDt;
    if (game.hitstop > 0) { game.hitstop -= realDt; dt = 0; }
    time += dt;
    world.position.y = Math.sin(clock * Math.PI * 2 / CONFIG.TERRAIN.BOB_PERIOD) * CONFIG.TERRAIN.BOB_AMP;
    if (game.flash > 0) { game.flash -= realDt; RIM_UNIFORMS.uFlash.value = Math.max(0, game.flash / COMBAT_CONFIG.FLASH_TIME) * COMBAT_CONFIG.FLASH_INT; }
    else RIM_UNIFORMS.uFlash.value = 0;

    if (INTRO.active) { updateStageIntro(realDt); seq.t = 0; }   // 단계 전환 연출 중엔 예고 시계를 멈춘다
    updateMonster(dt, time);
    if (AT && AT.tick) AT.tick(dt);   // 테스트 봇 입력 (가상 시간)
    if (!INTRO.active) updatePlayer(dt);
    if (npcs) npcs.update(dt);
    animatePlayer(dt, time);
    updateReactions(dt);
    updateDebris(dt);
    updateAtmosphere(dt, time);
    pickups.update(dt, time);
    for (const ps of [dust, puff, sparks, aura]) ps.update(dt);
    shards.update(dt);
    updateBolts(dt);
    updateQuick(dt);
    updateVillageSupport(dt);
    svUpdate(dt);                     // 단계별 마을: 연기 · 불꽃
    updateCamera(realDt, clock);
    if (INTRO.active) introCamera();
    if (ENDING.active) endingCamera(realDt);
    numbers.update(realDt);
  }
  function showFps(rawDt) {
    if (SHOW_FPS) {
      fpsStat.frames++; fpsStat.time += rawDt;
      if (fpsStat.time >= CONFIG.QUALITY.FPS_UI_INTERVAL) {
        fpsStat.fps = fpsStat.frames / fpsStat.time; fpsStat.ms = 1000 * fpsStat.time / fpsStat.frames;
        fpsStat.frames = 0; fpsStat.time = 0;
        const i = renderer.info.render;
        fpsEl.textContent =
          `FPS ${fpsStat.fps.toFixed(1)} (${fpsStat.ms.toFixed(1)}ms)  평균 ${quality.avg ? quality.avg.toFixed(1) : '-'}\n` +
          `draw ${i.calls}/${VOXEL_BUDGET.DRAW_CALLS}${i.calls > VOXEL_BUDGET.DRAW_CALLS ? ' ⚠ 초과' : ''}  tri ${(i.triangles / 1000).toFixed(0)}k\n` +
          `DPR ${dpr.toFixed(2)}  그림자 ${sun.castShadow ? 'on' : 'off'}  후처리 ${fxOn ? 'on' : 'off'}\n` +
          `몬스터 ${monster.kind} ${(monster.tris / 1000).toFixed(1)}k${monster.detail ? ` 디테일${monster.detail.level}` : ''}  ${MS.state}  HP ${MS.hp}${MS.rage ? ' 분노' : ''}\n` +
          `사냥꾼 ${PS.action}  공포 ${seq.fear.toFixed(2)}\n` +
          `NPC ${npcs ? npcs.stats() : 'off (?npc=0)'}` +
          (quality.log.length ? `\n하향: ${quality.log.join(' → ')}` : '');
      }
    }
  }
  if (AT && AT.next) AT.next(frame); else requestAnimationFrame(frame);   // 봇은 숨은 탭에서도 돌게
}

main().catch((e) => { console.error('[BOOT] 초기화 실패:', e); window.__boot.fail('초기화 실패 — ' + (e.message || e)); });
</script>
</body>
