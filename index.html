function endGame(win, reason) {
  if (game.over) return;
  game.over = true; game.result = win;
  game.killTime = game.huntStart ? clock - game.huntStart : Infinity;
  let bonusText = '';
  const CB = NPC_CONFIG.CELEBRATE;
  if (win && npcs) {                           // 대피소를 지켰으면 보상 보너스
    const r = npcs.celebrate();
    if (r.bonus > 0) {
      game.inventory[CB.BONUS_ITEM] = (game.inventory[CB.BONUS_ITEM] || 0) + r.bonus;
      bonusText = `\n대피소 보호 성공(주민 ${r.inShelter}명) — ${nameOf(CB.BONUS_ITEM)} ×${r.bonus}`;
      setTimeout(() => toast(`대피소를 지켜냈다! ${nameOf(CB.BONUS_ITEM)} +${r.bonus}`, 'weak'), CB.EMERGE_DELAY * 1000);
    }
  }
  // 마지막 단계(재도전 아님)를 깨면 전원 성문 앞 엔딩 컷, 아니면 환호·복구 작업을 보여준 뒤 결과
  const finale = win && !game.stage.tier && game.stage.id === STAGES.LIST[STAGES.LIST.length - 1].id;
  if (finale) startEnding();
  const delay = finale ? NPC_STAGE_CONFIG.ENDING.SHOW_TIME : win && npcs ? CB.SHOW_TIME : COMBAT_CONFIG.END_DELAY;
  setTimeout(() => {
    if (win) for (const it of pickups.list) if (it.alive) {   // 이기면 바닥에 남은 재료도 챙긴다
      it.alive = false; it.mesh.visible = false;
      game.inventory[it.name] = (game.inventory[it.name] || 0) + 1;
    }
    // 정산 → 저장
    const { [CB.BONUS_ITEM]: bundles = 0, ...picked } = game.inventory;
    const shelter = houses.find((h) => h.kind === 'shelter');
    const sum = Progress.settleHunt(save, {
      stageId: game.stage.id, tier: game.stage.tier, win, killed: win, villageRatio: game.village / COMBAT_CONFIG.VILLAGE.HP,
      shelterAlive: !!(shelter && shelter.alive), huntTime: game.killTime, pickups: picked, bundles,
      shelterSaved: bundles > 0, expMul: FX.expMul, levelAtStart: game.levelAtStart,
      liveExp: game.liveExp, liveParts: Object.entries(game.liveParts),
      itemsUsed: QS.used,
      bestiary: { species: game.stage.speciesKey, variant: game.stage.variantKey, parts: Object.keys(MS.parts).filter((p) => MS.parts[p].broken) },
    });
    // 단계별 마을: 이번에 무너진 집은 다음 사냥 시작 때 '복구 중'으로 (기능은 그대로) · 단계 전환 연출은 단계가 바뀔 때만
    save.village.repairs = houses.map((h, i) => (h.alive ? -1 : i)).filter((i) => i >= 0);
    save.village.lastStage = game.stage.id;
    const saved = writeSave(save, { keepOriginal: saveState.keepOriginal });
    game.lastResult = { sum, saved, win, reason };   // 결과 기록 (테스트 봇·디버그용)
    console[saved.ok ? 'info' : 'warn'](`[SAVE] 정산 후 저장: ${saved.reason}`, sum);
    sfx.sting(sum.cleared);
    $('end-title').textContent = sum.cleared ? `${game.stage.id}단계 ${game.stage.tier ? `${game.stage.re.label} ` : ''}클리어` : '사냥 실패';
    const nextSt = Progress.stageById(game.stage.id + 1);

    $('end-text').textContent = reason + (sum.failNote.length ? ` (${sum.failNote.join(', ')})` : '') + bonusText;
    renderResult(sum, saved, nextSt, nextStatus);

    const acts = $('end-actions');

const debris = [];
// 마을이 잃는 체력: 트리 '마을 수호자' · 레나 궁극기 '성벽'이 줄여 준다 (최소 1)
const villageLoss = (v) => Math.max(1, Math.round(v * Math.max(0, 1 + FX.villageDmgMul) * Math.max(0, 1 - buffFx('villageGuard'))));
function damageHouse(h, amount, from) {
  if (!h.alive) return;
  h.hp -= amount;
  if (h.hp > 0) { shards.burst(_v.set(h.x, CONFIG.SCALE.HOUSE_HEIGHT * 0.4, h.z), 6, COMBAT_CONFIG.SHARDS.COLOR_ROCK); return; }
  h.alive = false;
  if (npcs) npcs.onBuildingDestroyed(h);
  const V = COMBAT_CONFIG.VILLAGE, Dc = COMBAT_CONFIG.DEBRIS;
  hitVillage(villageLoss(V.HOUSE_VALUE));
  for (let i = 0; i < h.winCount; i++) windowsMesh.setMatrixAt(h.winStart + i, ZERO_M);
  windowsMesh.instanceMatrix.needsUpdate = true;
  const d = { h, t: 0, items: [] };
  for (let i = 0; i < h.count; i++) {
    houseMesh.getMatrixAt(h.start + i, _m);
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    _m.decompose(p, q, s);
    const dir = _v.set(p.x - from.x, 0, p.z - from.z).normalize();
    const sp = R(Dc.SPEED);
    d.items.push({ p, q, s: s.x, v: new THREE.Vector3(dir.x * sp + (Math.random() - 0.5) * 2, R(Dc.UP) * (0.3 + p.y / CONFIG.SCALE.HOUSE_HEIGHT), dir.z * sp + (Math.random() - 0.5) * 2),
      axis: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(), spin: (Math.random() - 0.5) * Dc.SPIN });
  }
  debris.push(d);
  dustBurst(_v.set(h.x, 0, h.z), D.PER_SLAM, 1.2);
  addTrauma(COMBAT_CONFIG.SHAKE_HOUSE);
  sfx.collapse();
  toast(`${h.kind === 'shelter' ? '대피소가' : '집이'} 무너졌다 — 마을 ${game.village}%`);
  if (game.village <= 0) endGame(false, '마을이 무너졌다.');
}
function updateDebris(dt) {
  const Dc = COMBAT_CONFIG.DEBRIS;
  for (let k = debris.length - 1; k >= 0; k--) {
    const d = debris[k];
    d.t += dt;
    const settle = d.t >= Dc.TIME;
    d.items.forEach((it, i) => {
      if (!settle) {
        it.v.y -= Dc.GRAVITY * dt;
        it.p.addScaledVector(it.v, dt);
        const half = it.s / 2;
        if (it.p.y < half) { it.p.y = half; it.v.y = -it.v.y * Dc.BOUNCE; it.v.x *= Dc.FRICTION; it.v.z *= Dc.FRICTION; it.spin *= Dc.FRICTION; }
        it.q.multiply(_q.setFromAxisAngle(it.axis, it.spin * dt));
      }
      const sc = settle ? it.s * Dc.RUBBLE_SCALE : it.s;
      houseMesh.setMatrixAt(d.h.start + i, _m.compose(it.p, it.q, _v.setScalar(sc)));
    });
    houseMesh.instanceMatrix.needsUpdate = true;
    if (settle) debris.splice(k, 1);   // 잔해로 남기고 계산은 멈춤
  }
}

function reactAt(p, k) {
  const Rc = CONFIG.REACT, G = grass;
  const gr = Rc.GRASS_R * k, tr = Rc.TREE_R * k;
  for (let i = 0; i < G.n; i++) {
    const dx = G.x[i] - p.x, dz = G.z[i] - p.z, d = Math.hypot(dx, dz);
    if (d > gr) continue;
    const target = 1 - (d / gr) * Rc.GRASS_EDGE_K;
    if (target > G.target[i]) { G.target[i] = target; G.dx[i] = dx / (d || 1); G.dz[i] = dz / (d || 1); }
    G.hold[i] = Rc.GRASS_HOLD; G.active.add(i);
  }
  for (const t of trees) {
    const dx = t.base.x - p.x, dz = t.base.z - p.z, d = Math.hypot(dx, dz);
    if (d > tr) continue;
    const target = 1 - (d / tr) * Rc.TREE_EDGE_K;
    if (target > t.target) { t.target = target; if (t.angle < 0.05) t.axis.set(dz / (d || 1), 0, -dx / (d || 1)); }
    t.hold = Rc.TREE_HOLD;
  }
}
function updateReactions(dt) {
  const Rc = CONFIG.REACT, G = grass;
  if (G.active.size) {
    for (const i of G.active) {
      if (G.bend[i] < G.target[i]) G.bend[i] = Math.min(G.target[i], G.bend[i] + Rc.GRASS_FLATTEN * dt);
      else if (G.hold[i] > 0) G.hold[i] -= dt;
      else { G.target[i] = 0; G.bend[i] = Math.max(0, G.bend[i] - Rc.GRASS_RECOVER * dt); }
      setGrassMatrix(i);
      if (G.bend[i] === 0 && G.target[i] === 0) G.active.delete(i);
    }

function damagePlayer(amount, from, knock) {
  if (PS.dead || game.over && game.result) return;
  if (PS.mount) return;   // 몬스터 몸에 붙어 있으면 땅 공격(밟기·내려찍기·돌진)은 안 닿음 — 대신 몸 흔들기·다리 털기 (CLIMB_CONFIG.COUNTER)
  if (PS.iframe > 0 || buffFx('invuln') > 0) {
    numbers.spawn(buffFx('invuln') > 0 ? '무적' : '회피', _v2.copy(PS.pos).setY(1.2), 'info');
    if (PS.action === 'roll') gainUlt(SKILLS.ULT_GAUGE.DODGE);
    return;
  }
  let k = (MS.rage ? MONSTER_CONFIG.RAGE.DMG_K : 1) * 100 / (100 + PS.def);   // 방어 (13-2-1)
  if (PS.action === 'attack' || PS.action === 'skill') k *= 1 - FX.attackGuard;
  k *= Math.max(0, 1 + buffFx('dmgTaken'));
  const guard = buffFx('guard');
  if (guard > 0) {   // 가드: 피해를 크게 줄이고 밀려나지 않음
    k *= 1 - guard; knock = 0;
    numbers.spawn('막음', _v2.copy(PS.pos).setY(1.5), 'info');
    if (FX.guardHeal) PS.hp = Math.min(PLAYER_CONFIG.HP, PS.hp + FX.guardHeal);
  }
  let dmg = Math.max(1, Math.round(amount * k));
  if (dmg >= PS.hp && FX.lastStand && !SK.lastStandUsed) { SK.lastStandUsed = true; dmg = PS.hp - 1; numbers.spawn('불굴!', _v2.copy(PS.pos).setY(1.8), 'skill'); }
  PS.hp = Math.max(0, PS.hp - dmg);
  PS.flash = PLAYER_CONFIG.FLASH_TIME;
  numbers.spawn(dmg, _v2.copy(PS.pos).setY(1.2), 'hurt');
  addTrauma(COMBAT_CONFIG.SHAKE_HURT);
  game.hitstop = COMBAT_CONFIG.HITSTOP_HURT;
  sfx.hurt(); vibrate(COMBAT_CONFIG.VIBRATE.HURT_MS);
  PS.knock.set(PS.pos.x - from.x, 0, PS.pos.z - from.z).normalize().multiplyScalar(knock * Math.max(0, 1 + FX.knockMul));
  PS.iframe = PLAYER_CONFIG.HURT.IFRAME + FX.hurtIframe;
  if (PS.hp <= 0) { PS.dead = true; PS.action = 'dead'; PS.t = 0; endGame(false, '사냥꾼이 쓰러졌다.'); }
  else if (guard <= 0) { PS.action = 'hurt'; PS.t = 0; }
}

function pushOut(px, pz, r) {
  const dx = PS.pos.x - px, dz = PS.pos.z - pz, d = Math.hypot(dx, dz), min = r + PLAYER_CONFIG.BODY_R;
  if (d < min && d > 1e-4) { PS.pos.x = px + dx / d * min; PS.pos.z = pz + dz / d * min; }
}
function collidePlayer() {
  const P = PLAYER_CONFIG;
  for (const h of houses) if (h.alive) pushOut(h.x, h.z, h.r * P.HOUSE_COLLIDE_K);
  pushOut(wellPos.x, wellPos.z, P.WELL_COLLIDE_R);
  for (const p of props) pushOut(p.x, p.z, p.r);
  for (const pen of pens) pushOutRect(PS.pos, pen.rect, P.BODY_R);
  for (const t of trees) if (t.angle < P.TREE_FALLEN) pushOut(t.base.x, t.base.z, P.TREE_COLLIDE_R);
  if (monster.group.visible && MS.state !== 'dead') for (const f of monster.feet) pushOut(f.x, f.z, MONSTER_CONFIG.FOOT_BLOCK_R);
  const lim = CONFIG.TERRAIN.HALF - P.BOUNDS_MARGIN;
  PS.pos.x = clamp(PS.pos.x, -lim, lim); PS.pos.z = clamp(PS.pos.z, -lim, lim);
}

function updatePlayer(dt) {
  const P = PLAYER_CONFIG, AT = P.ATTACK;
  PS.rollCD = Math.max(0, PS.rollCD - dt); PS.iframe = Math.max(0, PS.iframe - dt);
  PS.comboT = Math.max(0, PS.comboT - dt); PS.flash = Math.max(0, PS.flash - dt);
  PS.jumpCD = Math.max(0, PS.jumpCD - dt); PS.plungeCD = Math.max(0, PS.plungeCD - dt); PS.remountCD = Math.max(0, PS.remountCD - dt);
  updateStamina(dt);
  SK.cd.S1 = Math.max(0, SK.cd.S1 - dt); SK.cd.S2 = Math.max(0, SK.cd.S2 - dt);
  if (SK.buffs.length) SK.buffs = SK.buffs.filter((b) => b.until > clock);
  PS.t += dt;
  const canAct = !game.over;
  const mv = canAct ? readMove() : 0;

  if (PS.action === 'dead') { PS.deadT += dt; PS.vel.set(0, 0, 0); return; }
  if (PS.grabbed > 0) {   // 오르굼에게 잡힘: 못 움직이고, 공격 연타로 시간을 줄인다
    PS.grabbed -= dt; PS.vel.set(0, 0, 0);
    if (consume('attackAt')) { PS.grabbed -= game.stage.gimmick.MASH; numbers.spawn('버둥!', _v2.copy(PS.pos).setY(1.4), 'info'); }
    if (PS.grabbed <= 0) { PS.grabbed = 0; PS.iframe = PLAYER_CONFIG.HURT.IFRAME; toast('빠져나왔다!'); }
    return;
  }
  const wantSkill = () => canAct && ['S1', 'S2', 'ULT'].some((s) => consume(s + 'At') && trySkill(s));
  if (PS.action === 'mount') { updateMount(dt); return; }   // 몬스터에 붙어 있는 동안은 자리를 몬스터 몸이 정한다

  if (PS.action === 'move') {
    if (canAct && consume('jumpAt') && PS.jumpCD <= 0 && spendStamina(JUMP_CONFIG.STAMINA.JUMP)) startJump();
    else if (canAct && consume('rollAt') && PS.rollCD <= 0) startRoll();
    else if (wantSkill()) { /* trySkill이 동작을 바꿈 */ }
    else if (canAct && consume('attackAt')) startAttack(PS.comboT > 0);
    else {
      PS.vel.lerp(_v.copy(moveDir).multiplyScalar(mv * PS.runSpeed * (1 + buffFx('moveMul'))), 1 - Math.exp(-P.ACCEL * dt));
      if (mv > 0.1) PS.yaw += wrapAngle(Math.atan2(moveDir.x, moveDir.z) - PS.yaw) * (1 - Math.exp(-P.TURN_RATE * dt));
    }
  }
  if (PS.action === 'attack') {
    const w = AT.WIND[PS.combo], a = AT.ACTIVE, rec = AT.RECOVER[PS.combo];
    PS.vel.copy(pfwd()).multiplyScalar(PS.t < w + a ? AT.LUNGE[PS.combo] : 0);
    if (!PS.hitDone && PS.t >= w) { PS.hitDone = true; playerSwingHit(); }
    if (canAct && PS.t > w && consume('attackAt')) PS.queued = true;
    if (canAct && PS.t > w + a && PS.rollCD <= 0 && consume('rollAt')) startRoll();
    else if (PS.t > w + a && wantSkill()) { /* 후딜을 스킬로 끊음 */ }
    else if (PS.t >= w + a + rec) {
      PS.comboT = AT.COMBO_RESET;
      if (PS.queued) startAttack(true); else PS.action = 'move';
    }
  }
  if (PS.action === 'roll') {
    const R0 = P.ROLL;
    PS.vel.copy(PS.rollDir).multiplyScalar(R0.DIST / R0.TIME);
    if (PS.t >= R0.TIME) { PS.action = 'move'; PS.vel.multiplyScalar(0.3); }
  }
  if (PS.action === 'skill') updateSkill(dt);
  if (PS.action === 'jump') updateJump(dt, canAct ? mv : 0);
  if (PS.action === 'land') {   // 착지 충격: 잠깐 멈춤 (내려찍기는 더 길게)
    PS.vel.multiplyScalar(Math.exp(-P.ACCEL * dt));
    if (PS.t >= PS.landTime) PS.action = 'move';
  }
  if (PS.action === 'hurt') {
    PS.vel.copy(PS.knock);
    PS.knock.multiplyScalar(Math.exp(-P.HURT.DRAG * dt));
    if (PS.t >= P.HURT.TIME) PS.action = 'move';
  }
  PS.pos.addScaledVector(PS.vel, dt);
  collidePlayer();
}

function animatePlayer(dt, time) {

    }

  if (PS.action === 'attack') {
    const W = game.weapon, w = AT.WIND[PS.combo], a = AT.ACTIVE, t = PS.t;
    const k = smooth(clamp(t / w, 0, 1)), s = smooth(clamp((t - w) / a, 0, 1));
    const last = PS.combo === AT.DAMAGE.length - 1;
    legL = 0.35; legR = -0.3; armL = -0.5;
    if (last && W.SPIN_LAST) {   // 회전 베기
      armR = AN.SPIN_ARM;
      const rec = AT.RECOVER[PS.combo];
      torsoY = t < w ? -AN.SPIN_WIND * k : -AN.SPIN_WIND + (Math.PI * 2 + AN.SPIN_WIND) * smooth(clamp((t - w) / (a + rec * 0.5), 0, 1));
    } else if (W.ANIM === 'shoot') {   // 석궁: 겨누고 쏘기
      armR = AN.AIM_ARM; armL = AN.AIM_ARM * 0.8; torsoX = 0.08 * (1 - s);
    } else if (W.ANIM === 'thrust') {   // 창: 당겼다가 찌르기, 방패는 앞으로
      armR = lerp(lerp(0, AN.THRUST_BACK, k), AN.THRUST_OUT, s); armL = AN.SHIELD_ARM; torsoX = 0.15 * s;
    } else {   // 베기 / 해머 내려치기
      const smash = W.ANIM === 'smash';
      armR = lerp(lerp(0, smash ? AN.SMASH_UP : AN.SLASH_UP, k), smash ? AN.SMASH_DOWN : AN.SLASH_DOWN, s);
      torsoY = (PS.combo % 2 === 0 ? 1 : -1) * AN.SLASH_TWIST * (s - 0.5);
      torsoX = 0.1 + (smash ? 0.45 : 0.25) * s;
      if (W.VOXELS.armL.length && !smash) armL = PS.combo % 2 ? armR : -0.5;   // 쌍단검은 양손 번갈아
    }
  } else if (PS.action === 'skill') {
    const d = PS.skill.def, t = PS.t;
    legL = 0.35; legR = -0.3;
    if (d.type === 'strike' || d.type === 'aoe') {
      const w = d.wind, k = smooth(clamp(t / w, 0, 1)), s = smooth(clamp((t - w) / P.SKILL_ANIM.RECOVER * 3, 0, 1));
      armR = lerp(lerp(0, AN.SMASH_UP, k), AN.SMASH_DOWN, s); armL = armR * 0.8; torsoX = 0.1 + 0.45 * s;
    } else if (d.type === 'dash') { torsoX = AN.DASH_LEAN; armR = armL = 0.6; }
    else if (d.type === 'multi') { armR = Math.sin(t * AN.MULTI_SPEED) * 1.2 - 1.2; armL = -Math.sin(t * AN.MULTI_SPEED) * 1.2 - 1.2; }
    else if (d.type === 'shot') { armR = AN.AIM_ARM; armL = AN.AIM_ARM * 0.8; }

  } else if (PS.action === 'roll') {

    else { spinX = Math.PI * 2 * u; legL = legR = AN.ROLL_TUCK; armL = armR = AN.ROLL_TUCK; lift = -AN.ROLL_DROP * Math.sin(Math.PI * u); }
  } else if (PS.action === 'jump' || PS.action === 'land' || PS.action === 'mount') {
    // 점프: 웅크림 → 도약(늘어남) → 공중 자세 → 착지 충격(찌그러짐) · 올라타기: 매달려 다리 흔들기 + 찌르기 (JUMP_CONFIG.ANIM)
    const JA = JUMP_CONFIG.ANIM, L = JUMP_CONFIG.LAND;

      if (m && m.stabT < CLIMB_CONFIG.HIT_INTERVAL) armR = lerp(JA.STAB_ARM[0], JA.STAB_ARM[1], m.stabT / CLIMB_CONFIG.HIT_INTERVAL);

    } else if (PS.jp === 'crouch') {

    } else if (PS.thrown) {   // 내동댕이쳐짐: 굴러 떨어짐

    } else {

      armL = armR = rising ? JA.AIR_ARM : JA.FALL_ARM;
      squash = rising ? -JA.STRETCH * clamp(PS.vy / 6, 0, 1) : 0;
      if (PS.airAtk) {
        const s = smooth(clamp(PS.airAtk.t / (JUMP_CONFIG.AIR_WIND + JUMP_CONFIG.AIR_RECOVER * 0.5), 0, 1));

  } else if (PS.action === 'dead') {

    lift = -0.25 * smooth(clamp(PS.deadT / AN.DEATH_TIME, 0, 1));

  let headYaw = 0, headX = 0;

  hunter.root.position.set(PS.pos.x + (Math.random() - 0.5) * shiver, PS.y, PS.pos.z + (Math.random() - 0.5) * shiver);   // PS.y = 점프·올라타기 높이
  hunter.root.rotation.y = PS.yaw;
  hunter.spin.rotation.x = spinX;
  hunter.spin.position.y = CONFIG.SCALE.HUNTER_HEIGHT / 2 + lift;

  // 맞으면 흰 번쩍임, 무적 중엔 깜빡임
  const fl = PS.flash / P.FLASH_TIME;
  if (fl > 0) hunterMat.emissive.setScalar(fl);
  else if (buffFx('guard') > 0 || buffFx('invuln') > 0 || buffFx('dmgTaken') < 0) hunterMat.emissive.setRGB(...P.SKILL_ANIM.GUARD_GLOW);   // 가드·무적·성벽 중 푸른 빛
  else hunterMat.emissive.setScalar(0);

}

// ---------- 직업 스킬 ----------
function trySkill(slot) {
  const s = SK.slots[slot];

  if (!s.unlocked) { numbers.spawn(`Lv ${s.reqLv}에 열려요`, _v2.set(PS.pos.x, 1.8, PS.pos.z), 'info'); return false; }
  if (slot === 'ULT' ? SK.gauge < SKILLS.ULT_GAUGE.MAX : SK.cd[slot] > 0) return false;
  const d = s.def;
  if (slot === 'ULT') SK.gauge = 0;

  PS.skill = { slot, def: d, done: false, hits: 0, hitSet: new Set(), ultK: slot === 'ULT' ? 1 + FX.ultMul : 1 };
  if (readMove() > 0.1) PS.yaw = Math.atan2(moveDir.x, moveDir.z);
  else { const tg = pickTargets(d.range || d.reach || d.radius || PLAYER_CONFIG.ATTACK.AIM_R, -1, d.type === 'shot' ? 8 : PLAYER_CONFIG.ATTACK.REACH_Y, 1)[0]; if (tg) PS.yaw = Math.atan2(tg.pos.x - PS.pos.x, tg.pos.z - PS.pos.z); }
  numbers.spawn(d.name, _v2.set(PS.pos.x, 2.0, PS.pos.z), 'skill');
  sfx.skill();
  const tk = 1 + FX.trapMul;
  if (d.type === 'buff') SK.buffs.push({ name: d.name, fx: d.fx, until: clock + d.time * PS.skill.ultK });
  if (d.type === 'bind') bindMonster(d.time * tk);
  if (d.type === 'trap') placeTrap(d.down * tk);
  if (d.type === 'net') downMonster(d.down * tk * PS.skill.ultK, '그물!');
  return true;
}
function updateSkill(dt) {
  const sk = PS.skill, d = sk.def, A = PLAYER_CONFIG.SKILL_ANIM, AT = PLAYER_CONFIG.ATTACK;
  const base = game.weapon.SKILL_BASE * PS.atkMul * sk.ultK;
  const hit = (h, mult) => damageMonster(h, base * mult, { breakK: d.breakK, stun: d.stun, jointK: d.jointK });
  let end = A.CAST_TIME;
  switch (d.type) {
    case 'strike':
      PS.vel.set(0, 0, 0); end = d.wind + A.RECOVER;
      if (!sk.done && PS.t >= d.wind) {
        sk.done = true;
        const h = pickTargets(d.reach, 0, AT.REACH_Y + 0.4, 1)[0];
        if (h) hit(h, d.needDown && MS.state !== 'stagger' ? d.altMult : d.mult);
        dustBurst(_v.copy(PS.pos).addScaledVector(pfwd(), d.reach * 0.7), A.AOE_DUST * 0.5, 0.7);
        addTrauma(A.SHAKE);
      }
      break;
    case 'dash':
      end = d.time + A.RECOVER * 0.5;
      PS.vel.copy(pfwd()).multiplyScalar(PS.t < d.time ? d.dist / d.time : 0);
      if (!sk.done) { const h = pickTargets(d.reach, -1, AT.REACH_Y, 1)[0]; if (h) { sk.done = true; hit(h, d.mult); addTrauma(A.SHAKE); } }
      break;
    case 'multi':
      PS.vel.set(0, 0, 0); end = d.time + A.RECOVER * 0.5;
      while (sk.hits < d.hits && PS.t >= (sk.hits + 1) * (d.time / d.hits)) {
        sk.hits++;
        const h = pickTargets(d.reach, 0, AT.REACH_Y, 1)[0];
        if (h) hit(h, d.mult);
      }
      break;
    case 'aoe':
      PS.vel.set(0, 0, 0); end = d.wind + A.RECOVER;
      if (!sk.done && PS.t >= d.wind) {
        sk.done = true;
        const hs = pickTargets(d.radius, -1, AT.REACH_Y, monster.hurt.length);
        hs.forEach((h, i) => damageMonster(h, base * d.mult, { stun: i === 0 ? d.stun : 0 }));   // 기절치는 한 번만
        dustBurst(PS.pos, A.AOE_DUST, 1.2);
        addTrauma(A.SHAKE);
      }
      break;
    case 'shot':
      PS.vel.set(0, 0, 0); end = d.wind + A.RECOVER * 0.6;
      if (!sk.done && PS.t >= d.wind) {
        sk.done = true;
        fireBolt(pickTargets(d.range, d.sure ? -1 : 0.5, 8, d.pierce), base * d.mult, { stun: COMBAT_CONFIG.BOLT.STUN * 2 });
      }
      break;
    default: PS.vel.set(0, 0, 0);   // buff·bind·trap·net은 시작할 때 이미 효과
  }

}

// ---------- 석궁 볼트 ----------
const bolts = (() => {
  const B = COMBAT_CONFIG.BOLT, list = [];
  const geo = new THREE.BoxGeometry(B.THICK, B.THICK, B.LEN), mat = new THREE.MeshBasicMaterial({ color: B.COLOR });
  for (let i = 0; i < B.POOL; i++) {
    const m = new THREE.Mesh(geo, mat); m.visible = false; m.layers.set(L_FX); m.frustumCulled = false;
    list.push({ m, from: new THREE.Vector3(), to: new THREE.Vector3(), t: 0, dur: 1, alive: false, target: null, dmg: 0, opts: null });
  }
  return { list };
})();
function fireBolt(targets, dmg, opts, origin = null) {   // origin: 쏘는 곳 (없으면 사냥꾼, 포탑은 포탑 꼭대기)
  const B = COMBAT_CONFIG.BOLT, from = origin ? _v.copy(origin) : _v.set(PS.pos.x, B.Y, PS.pos.z);
  const shots = targets.length ? targets : [null];   // 빗나가면 앞으로 날아가 사라짐
  for (const h of shots) {
    const b = bolts.list.find((x) => !x.alive) || bolts.list[0];
    b.alive = true; b.t = 0; b.target = h; b.dmg = dmg; b.opts = opts;
    b.from.copy(from);
    if (h) b.to.copy(h.pos); else b.to.copy(from).addScaledVector(pfwd(), B.MISS_RANGE);
    b.dur = Math.max(0.05, b.from.distanceTo(b.to) / B.SPEED);
    b.m.visible = true;
  }
  sfx.swing();
}
function updateBolts(dt) {
  for (const b of bolts.list) {
    if (!b.alive) continue;
    b.t += dt;
    const k = Math.min(1, b.t / b.dur);
    b.m.position.lerpVectors(b.from, b.to, k);
    b.m.lookAt(world.localToWorld(_v.copy(b.to)));
    if (k >= 1) {
      b.alive = false; b.m.visible = false;
      if (b.target && MS.state !== 'dead') damageMonster(b.target, b.dmg, b.opts);
    }
  }
}

const traps = [];
const trapGeo = new THREE.BoxGeometry(COMBAT_CONFIG.TRAP.SIZE, COMBAT_CONFIG.TRAP.H, COMBAT_CONFIG.TRAP.SIZE);
const trapMat = new THREE.MeshLambertMaterial({ color: COMBAT_CONFIG.TRAP.COLOR });
function placeTrap(down) {
  const T0 = COMBAT_CONFIG.TRAP;
  if (traps.length >= T0.MAX) { const old = traps.shift(); world.remove(old.mesh); }
  const mesh = new THREE.Mesh(trapGeo, trapMat);
  mesh.position.set(PS.pos.x, T0.H / 2, PS.pos.z); mesh.receiveShadow = true;
  world.add(mesh);
  traps.push({ mesh, x: PS.pos.x, z: PS.pos.z, down });
}
function checkTraps(p, r = COMBAT_CONFIG.TRAP.R) {   // 몬스터 발(또는 몸 아래 r)이 덫을 밟으면 다운
  for (let i = traps.length - 1; i >= 0; i--) {
    const t = traps[i];
    if (Math.hypot(t.x - p.x, t.z - p.z) > r) continue;
    if (downMonster(t.down, '덫!')) { world.remove(t.mesh); traps.splice(i, 1); }
  }
}

}
// 사냥꾼 앞 거리 d 지점 (판 밖이면 안쪽으로)
function aheadPoint(d) {
  const p = _v2.copy(PS.pos).addScaledVector(pfwd(), d).setY(0);

}
function useQuick(i) {

// 연막 중 몬스터가 갈 곳: 사냥꾼 반대편(몬스터 쪽 ±WANDER_SPREAD)으로 WANDER_MIN 이상 떨어진 판 위 지점
