<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c2129">
<title>거인의 발치 — 전투 프로토타입</title>
<style>
  :root {
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --ink: #f3e6cf;
    --ink-dim: #f3e6cf99;
    --bg: #1c2129;
    --panel: #10141acc;
    --line: #f3e6cf40;
    --hp-player: #8fd36b;
    --hp-village: #f0b45a;
    --hp-monster: #d9473a;
    --weak: #ffd75e;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font-family: inherit; color: var(--ink); -webkit-tap-highlight-color: transparent; touch-action: none; }

  #loading {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 24px;
    background: var(--bg); font-size: 15px; text-align: center; transition: opacity .6s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .pill {
    min-height: 44px; padding: 0 20px; border-radius: 22px; border: 1px solid var(--line);
    background: #f3e6cf14; font-size: 15px;
  }

  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 50% 55%, transparent 45%, #000000 100%);
  }

  #hud {
    position: fixed; z-index: 5; pointer-events: none;
    top: calc(var(--safe-t) + 8px); left: calc(var(--safe-l) + 12px); right: calc(var(--safe-r) + 112px);
    display: flex; flex-direction: column; gap: 6px; opacity: 0; transition: opacity .5s;
  }
  #hud.show { opacity: 1; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; text-shadow: 0 1px 2px #000; }
  .bar-row .label { flex: 0 0 auto; min-width: 44px; }
  .bar { position: relative; flex: 1; height: 8px; border-radius: 4px; background: #00000080; border: 1px solid #ffffff26; overflow: hidden; }
  .bar > i { position: absolute; inset: 0; transform-origin: left; background: var(--c); transition: transform .15s; }
  .bar.big { height: 10px; }
  .bar .mark { position: absolute; top: -1px; bottom: -1px; left: 50%; width: 2px; background: #ffffffaa; }
  .bars-small { display: flex; gap: 12px; }
  .bars-small .bar-row { flex: 1; }

  #mute, #gear {
    position: fixed; z-index: 6; top: calc(var(--safe-t) + 4px); right: calc(var(--safe-r) + 8px);
    width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel); font-size: 18px;
  }
  #gear { right: calc(var(--safe-r) + 58px); }

  #settings {
    position: fixed; inset: 0; z-index: 22; display: none; align-items: center; justify-content: center;
    padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px); background: #0b0e1399;
  }
  #settings.show { display: flex; }
  #settings .card {
    width: 100%; max-width: 340px; padding: 20px; border-radius: 16px; background: #141a22f2; border: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 14px;
  }
  #settings h2 { margin: 0; font-size: 18px; }
  #settings .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
  #settings .row b { font-variant-numeric: tabular-nums; }
  #bright { width: 100%; height: 44px; margin: 0; accent-color: var(--hp-village); touch-action: pan-x; }
  #settings .note { margin: 0; font-size: 12px; color: var(--ink-dim); line-height: 1.5; }
  #settings .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); margin-top: -10px; }

  #toasts {
    position: fixed; z-index: 6; pointer-events: none; left: 0; right: 0;
    top: calc(var(--safe-t) + 70px); display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .toast {
    padding: 6px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
    font-size: 13px; animation: toast 2.4s forwards;
  }
  .toast.weak { color: var(--weak); border-color: #ffd75e66; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  #dmg { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .num {
    position: absolute; left: 0; top: 0; font-weight: 800; font-size: 16px; white-space: nowrap;
    color: #fff; text-shadow: 0 0 3px #000, 0 1px 2px #000; will-change: transform, opacity;
  }
  .num.weak { color: var(--weak); font-size: 20px; }
  .num.hurt { color: #ff7a6b; }
  .num.info { color: #cfe8ff; font-size: 13px; font-weight: 600; }

  #stick { position: fixed; z-index: 4; pointer-events: none; display: none; }
  #stick .base {
    position: absolute; width: 112px; height: 112px; left: -56px; top: -56px; border-radius: 50%;
    border: 2px solid #f3e6cf55; background: #10141a40;
  }
  #stick .knob {
    position: absolute; width: 48px; height: 48px; left: -24px; top: -24px; border-radius: 50%;
    background: #f3e6cfaa; box-shadow: 0 0 8px #0008;
  }

  #controls {
    position: fixed; z-index: 6; right: calc(var(--safe-r) + 16px); bottom: calc(var(--safe-b) + 20px);
    width: 168px; height: 150px; display: none;
  }
  #controls.show { display: block; }
  #btn-attack, #btn-roll {
    position: absolute; border-radius: 50%; border: 2px solid #f3e6cf66; background: var(--panel);
    font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  #btn-attack { right: 0; bottom: 0; width: 88px; height: 88px; font-size: 15px; }
  #btn-roll { left: 0; top: 0; width: 64px; height: 64px; font-size: 12px;
    background: conic-gradient(#10141acc calc(var(--cd, 1) * 360deg), #000000d0 0); }
  #btn-attack.down, #btn-roll.down { transform: scale(.93); background-color: #f3e6cf33; }

  /* 조작 묶음: 공격(88) · 구르기(62) · 직업 스킬 3개(52, 터치 48px 이상) */
  #controls { width: 184px; height: 160px; }
  #btn-roll { left: auto; top: auto; right: 98px; bottom: 2px; width: 62px; height: 62px; }
  .skill {
    position: absolute; width: 52px; height: 52px; padding: 0; border-radius: 50%; border: 2px solid #f3e6cf66;
    background: conic-gradient(#10141acc calc(var(--cd, 1) * 360deg), #000000d8 0);
    font-size: 21px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .skill .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; text-shadow: 0 0 3px #000; }
  .skill .lv { position: absolute; bottom: 3px; font-size: 10px; font-weight: 700; }
  .skill.locked { opacity: .5; }
  .skill.ready { border-color: var(--weak); box-shadow: 0 0 10px #ffd75e55; }
  .skill.down { transform: scale(.93); }
  /* 점프 (56px, 구르기 왼쪽): 테두리 고리 = 기력. 탭 = 낮게, 누르고 있으면 = 높게 */
  #btn-jump {
    position: absolute; right: 168px; bottom: 6px; width: 56px; height: 56px; border-radius: 50%; border: 2px solid #f3e6cf66;
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    background: conic-gradient(#10141acc calc(var(--cd, 1) * 360deg), #000000d0 0);
  }
  #btn-jump.down { transform: scale(.93); background-color: #f3e6cf33; }
  #strow { transition: opacity .3s; }
  #strow.full { opacity: 0; }
  #btn-s1 { right: 4px; bottom: 100px; }
  #btn-s2 { right: 64px; bottom: 86px; }
  #btn-ult { right: 124px; bottom: 72px; }
  /* 아이템 퀵슬롯 3칸 (52px) — 조작 묶음 위 */
  #quick { position: fixed; z-index: 6; right: calc(var(--safe-r) + 16px); bottom: calc(var(--safe-b) + 192px); display: none; gap: 8px; }
  #quick.show { display: flex; }
  .skill.qs { position: relative; }
  .qs .n { position: absolute; right: -4px; top: -4px; min-width: 18px; padding: 0 4px; border-radius: 9px; background: #000d; font-size: 11px; font-weight: 700; line-height: 18px; }
  .qs.empty { opacity: .4; }
  .num.heal { color: #8fd36b; font-size: 17px; }
  .num.wall { color: #9cc8ff; }

  .bar.thin { height: 4px; }
  .num.exp { color: #ffe38a; font-size: 14px; }
  .num.skill { color: #fff4d0; font-size: 15px; }

  #levelup {
    position: fixed; z-index: 7; left: 50%; top: 34%; width: min(320px, calc(100% - 32px));
    transform: translate(-50%, 8px) scale(.96); padding: 12px 16px; border-radius: 14px; text-align: center; pointer-events: none;
    background: #2a2010ee; border: 1px solid #ffe38a88; box-shadow: 0 0 24px #ffd75e44; opacity: 0; transition: opacity .35s, transform .35s;
  }
  #levelup.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #levelup .ti { font-size: 22px; font-weight: 800; color: #ffe38a; }
  #levelup .st { font-size: 13px; margin-top: 4px; line-height: 1.5; }
  #levelup .nw { font-size: 13px; margin-top: 4px; color: var(--weak); }

  /* ---------- 메뉴 화면 공통 (값은 UI_THEME → --ui-* 변수, applyUiTheme) ----------
     카드 = 한 줄 요약(탭하면 상세 펼침) + 오른쪽 실행 버튼. 비활성 3종: .st-locked(자물쇠+조건) · .st-gold(가격 빨강) · .st-mats(부족 재료만 강조) */
  .menu { font-size: var(--ui-fs-body); line-height: 1.45; }
  .menu h2 { margin: 0 0 var(--ui-s); font-size: var(--ui-fs-h2); display: flex; align-items: center; gap: var(--ui-s); }
  /* 메뉴 머리: 스크롤해도 위에 붙어 있는 제목 + ✕ 닫기 (맨 아래 닫기까지 내려가지 않아도 됨) */
  .shead { position: sticky; top: calc(-1 * (var(--safe-t) + var(--ui-l))); z-index: 3; display: flex; align-items: center; gap: var(--ui-s);
    margin: calc(-1 * (var(--safe-t) + var(--ui-l))) calc(-1 * var(--ui-l)) var(--ui-s); padding: calc(var(--safe-t) + var(--ui-s)) var(--ui-l) var(--ui-s); background: var(--ui-bg); }
  .shead h2 { flex: 1; min-width: 0; margin: 0; }
  .xclose { flex: 0 0 auto; width: var(--ui-touch); height: var(--ui-touch); border-radius: 50%; border: 1px solid var(--ui-line); background: var(--ui-card); color: var(--ui-ink);
    font-size: var(--ui-fs-title); display: flex; align-items: center; justify-content: center; padding: 0; }
  .menu .who { font-size: var(--ui-fs-small); color: var(--ui-ink-dim); margin-bottom: var(--ui-m); line-height: 1.5; }
  .menu .note { font-size: var(--ui-fs-small); color: var(--ui-accent); margin-bottom: var(--ui-m); }
  .menu .pill { min-height: var(--ui-touch); font-size: var(--ui-fs-body); display: inline-flex; align-items: center; justify-content: center; gap: var(--ui-xs); }
  .menu .pill.attn { border-color: var(--ui-accent); color: var(--ui-accent); }
  .vx { image-rendering: pixelated; flex: 0 0 auto; vertical-align: middle; }
  .stage-tools { display: flex; gap: var(--ui-s); margin-bottom: var(--ui-m); flex-wrap: wrap; }
  .stage-tools #btn-job, .stage-tools #btn-tree { flex-basis: 40%; }   /* 1줄: 사냥꾼·트리, 2줄: 대장간·상점·도감 */
  .stage-tools .pill { flex: 1 1 26%; min-width: 0; padding: 0 var(--ui-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet {
    position: fixed; inset: 0; z-index: 23; display: none; flex-direction: column; overflow-y: auto;
    padding: calc(var(--safe-t) + var(--ui-l)) var(--ui-l) calc(var(--safe-b) + var(--ui-l)); background: var(--ui-bg);
  }
  .sheet.show { display: flex; }
  .sheet .foot { display: flex; gap: var(--ui-s); margin-top: var(--ui-s); flex-wrap: wrap; }
  .sheet .foot .pill { flex: 1; }
  .tabs, .chips { display: flex; gap: var(--ui-xs); margin-bottom: var(--ui-m); }
  .tabs button, .chips button { flex: 1 1 0; min-width: 0; min-height: var(--ui-touch); padding: 0 var(--ui-xs); border-radius: var(--ui-r-btn); border: 1px solid var(--ui-line);
    background: var(--ui-card); font-size: var(--ui-fs-small); display: flex; align-items: center; justify-content: center; gap: var(--ui-xs); white-space: nowrap; overflow: hidden; }
  .chips { flex-wrap: wrap; }   /* 좁은 화면에서 마지막 칩(장신구)이 잘리지 않게 줄바꿈 */
  .chips button { flex: 0 0 auto; padding: 0 var(--ui-m); border-radius: var(--ui-r-chip); }
  .tabs button[aria-selected="true"], .chips button[aria-pressed="true"] { border-color: var(--ui-accent); color: var(--ui-accent); background: var(--ui-accent-bg); }
  .sec { font-size: var(--ui-fs-small); color: var(--ui-ink-dim); margin: var(--ui-m) 0 var(--ui-xs); display: flex; align-items: center; gap: var(--ui-xs); }
  .card { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: var(--ui-s); margin-bottom: var(--ui-s);
    border-radius: var(--ui-r-card); border: 1px solid var(--ui-line); background: var(--ui-card); }
  .card > .main { display: flex; align-items: center; gap: var(--ui-m); min-height: var(--ui-card-h); padding: var(--ui-s) 0 var(--ui-s) var(--ui-m);
    border: 0; background: none; text-align: left; font-size: var(--ui-fs-body); width: 100%; cursor: pointer; }
  .card > .main .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .card .ttl { font-weight: 700; font-size: var(--ui-fs-title); display: flex; flex-wrap: wrap; align-items: center; gap: var(--ui-xs); }
  .card .line { font-size: var(--ui-fs-small); color: var(--ui-ink-dim); display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--ui-s); }
  .card .chev { flex: 0 0 auto; color: var(--ui-ink-dim); transition: transform var(--ui-open-ms) ease; }
  .card.open .chev { transform: rotate(180deg); }
  .card > .act, .card > .actwrap > .act { min-width: var(--ui-act-w); min-height: var(--ui-touch); margin-right: var(--ui-m); padding: 0 var(--ui-s); border-radius: var(--ui-r-btn);
    border: 1px solid var(--ui-accent); background: var(--ui-accent-bg); color: var(--ui-accent); font-size: var(--ui-fs-body); font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: var(--ui-xs); }
  .card > .act:disabled, .card > .actwrap > .act:disabled { border-color: var(--ui-line); background: none; color: var(--ui-ink-dim); font-weight: 400; }
  .card > .actwrap { display: flex; flex-direction: column; align-items: stretch; gap: 2px; margin-right: var(--ui-m); max-width: var(--ui-actwrap-w); }
  .card > .actwrap > .act { margin-right: 0; }
  .actnote { font-size: var(--ui-fs-small); line-height: 1.25; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 2px; }
  .actnote.short { color: var(--ui-bad); font-weight: 700; } .actnote.lock { color: var(--ui-lock); } .actnote.full { color: var(--ui-ink-dim); } .actnote.after { color: var(--ui-ink-dim); }
  .card > .detail { grid-column: 1 / -1; padding: 0 var(--ui-m) var(--ui-m); font-size: var(--ui-fs-small); line-height: 1.55; display: flex; flex-direction: column; gap: var(--ui-xs); }
  .card > .detail[hidden] { display: none; }
  .card .tag { font-size: var(--ui-fs-small); font-weight: 400; padding: 0 var(--ui-xs); border-radius: var(--ui-xs); background: var(--ui-tag-bg); color: var(--ui-tag); }
  .card .pips { color: var(--ui-accent); letter-spacing: 2px; }
  .card.cur { border-color: var(--ui-accent); }
  .card.st-locked { opacity: var(--ui-lock-op); background: var(--ui-lock-bg); }
  .card.st-locked .lock { color: var(--ui-lock); display: inline-flex; align-items: center; gap: var(--ui-xs); }
  .card.st-locked > .act { border-style: dashed; }
  .cost { display: inline-flex; align-items: center; gap: var(--ui-xs); white-space: nowrap; padding: 0 var(--ui-xs); border-radius: var(--ui-xs); }
  .cost.dim { color: var(--ui-ink-dim); }
  .cost.lack { color: var(--ui-lack); background: var(--ui-lack-bg); font-weight: 700; }
  .cost.price { color: var(--ui-ink); font-weight: 700; }
  .cost.price.short { color: var(--ui-bad); }
  .act .short, .line .short { color: var(--ui-bad); }
  .guide { padding: var(--ui-s); border-radius: var(--ui-s); background: var(--ui-guide-bg); color: var(--ui-guide); }
  .guide b { color: var(--ui-ink); }
  .kv { display: flex; flex-wrap: wrap; gap: 2px var(--ui-m); }
  .qbar { display: flex; gap: var(--ui-s); margin-bottom: var(--ui-m); }
  .qbar button { flex: 1; min-height: calc(var(--ui-touch) + var(--ui-l)); border-radius: var(--ui-r-btn); border: 1px solid var(--ui-line); background: var(--ui-card);
    font-size: var(--ui-fs-small); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .qbar button[aria-pressed="true"] { border-color: var(--ui-accent); color: var(--ui-accent); background: var(--ui-accent-bg); }
  .vtable { width: 100%; border-collapse: collapse; font-size: var(--ui-fs-small); margin-bottom: var(--ui-s); }
  .vtable th, .vtable td { padding: var(--ui-xs) 2px; text-align: center; border-bottom: 1px solid var(--ui-line); }
  .vtable th:first-child, .vtable td:first-child { text-align: left; color: var(--ui-ink-dim); white-space: nowrap; }
  .vtable .cur { color: var(--ui-accent); font-weight: 700; background: var(--ui-accent-bg); }
  .sum { padding: var(--ui-s) var(--ui-m); border-radius: var(--ui-r-card); background: var(--ui-card); margin-bottom: var(--ui-s); }
  .weakline { display: flex; align-items: center; gap: var(--ui-xs); }
  .weakline.known { color: var(--ui-accent); }
  .muted { color: var(--ui-ink-dim); }
  /* 사냥꾼 선택: 회전 미리보기 · 능력 막대 · 역할 태그 · 스킬 미리보기 · 선택 확인 */
  body:has(#stages.show) #toasts, body:has(.sheet.show) #toasts { z-index: 26; }   /* 메뉴 위 알림 (직업 변경 안내 등) */
  /* 스킬 트리: 남은 포인트 크게 · 범례 · 갈래 3열 세로 노드 + 연결선 · 아래 상세 패널 · 초기화 팝업 */
  .tree-pts { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--ui-xs) var(--ui-s); margin-bottom: var(--ui-s); }
  .tree-pts .lbl { font-size: var(--ui-fs-title); font-weight: 700; }
  .tree-pts b { font-size: var(--ui-tree-points); line-height: 1; color: var(--ui-accent); }
  .tree-pts b.zero { color: var(--ui-ink-dim); }
  .tree-pts .who { margin: 0; flex-basis: 100%; }
  .tree-legend { display: flex; flex-wrap: wrap; gap: var(--ui-xs) var(--ui-m); font-size: var(--ui-fs-small); color: var(--ui-ink-dim); margin-bottom: var(--ui-m); }
  .tree-legend .lg { display: inline-flex; align-items: center; gap: var(--ui-xs); }
  .tree-legend i { display: inline-block; font-style: normal; }
  .tree-legend i.pip-on::before { content: '●'; color: var(--ui-accent); } .tree-legend i.pip-off::before { content: '○'; color: var(--ui-accent); }
  .tree-legend i.ln { width: var(--ui-l); height: 0; border-top: var(--ui-tree-line) solid; }
  .tree-legend i.ln.done { border-color: var(--ui-accent); } .tree-legend i.ln.ready { border-color: var(--ui-accent); border-top-style: dashed; } .tree-legend i.ln.locked { border-color: var(--ui-line); border-top-style: dotted; }
  .tree-legend i.star::before { content: '★'; color: var(--ui-tree-reco); }
  .tree-graph { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ui-s); margin-bottom: var(--ui-m); }
  .tcol { display: flex; flex-direction: column; align-items: center; }
  .thead { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: var(--ui-xs); font-size: var(--ui-fs-small); }
  .tlink { width: 0; height: var(--ui-tree-gap); border-left: var(--ui-tree-line) dotted var(--ui-line); }
  .tlink.done { border-left: var(--ui-tree-line) solid var(--ui-accent); }

  /* 마지막 단계 엔딩 글 */

    max-width: min(78vw, 520px); max-height: 34vh; overflow: hidden; padding: 6px 8px; border-radius: 6px; background: #000000b0;

<script>
  // 부트 설정표 — three.js 모듈 자체를 못 받는 경우까지 잡으려고 일반 스크립트에 둔다
  window.BOOT_CONFIG = { LOAD_TIMEOUT_MS: 10000 };
  window.__boot = {
    done: false,
    fail(reason) {
      if (this.done) return;
      this.done = true;
      console.error('[BOOT] ' + reason);
      document.getElementById('loading-msg').textContent = '불러오지 못했어요: ' + reason;
      document.getElementById('retry').hidden = false;
    },
    ready() {
      clearTimeout(this.timer);
      if (this.done) console.warn('[BOOT] 타임아웃 뒤에 늦게 로드됨 → 그대로 시작');
      this.done = true;
      document.getElementById('loading').classList.add('hide');
    },
  };
  window.__boot.timer = setTimeout(() => window.__boot.fail(
    (window.BOOT_CONFIG.LOAD_TIMEOUT_MS / 1000) + '초 타임아웃 — three.js 모듈을 받지 못함 (네트워크/CDN 확인)'
  ), window.BOOT_CONFIG.LOAD_TIMEOUT_MS);
</script>

// ============================================================
// VOXEL_MODELS — 주민 5종 + 가축 6종. 파츠마다 피벗(칸 모서리 좌표)과 상자 목록.
//   상자 = [x0, x1, y0, y1, z0, z1, 색 키] (칸, 양끝 포함). 나중 상자가 앞 상자를 덮어쓴다.
//   anim: body·head·legA·legB·armA·armB·tail — 셰이더가 이 이름으로 움직임을 고른다.
//   좌표: +z가 앞, y=0이 발바닥, x=0이 몸 가운데.
// ============================================================
// 사람형 기본 파츠 (12칸): 다리 0–3, 몸통 4–6, 큰 머리 7–11 (머리가 커서 귀엽고 실루엣이 선명)
function humanoid(palette, extra = {}, opt = {}) {
  const ax = opt.wide ? 1 : 0;   // 덩치가 크면 팔을 한 칸 바깥으로
  const parts = {
    legL: { anim: 'legA', pivot: [-1, 4, 0], boxes: [[-2, -1, 0, 3, -1, 0, 'pants'], [-2, -1, 0, 1, -1, 0, 'boots']] },
    legR: { anim: 'legB', pivot: [1, 4, 0], boxes: [[0, 1, 0, 3, -1, 0, 'pants'], [0, 1, 0, 1, -1, 0, 'boots']] },
    body: { anim: 'body', pivot: [0, 4, 0], boxes: [opt.wide ? [-3, 2, 4, 6, -2, 1, 'shirt'] : [-2, 1, 4, 6, -1, 0, 'shirt']] },
    head: { anim: 'head', pivot: [0, 7, -0.5], boxes: [
      [-3, 2, 7, 11, -3, 1, 'skin'], [-3, 2, 11, 11, -3, 1, 'hair'], [-3, 2, 8, 11, -3, -3, 'hair'],
      [-2, -2, 9, 9, 1, 1, 'eye'], [1, 1, 9, 9, 1, 1, 'eye'], [-2, -2, 8, 8, 1, 1, 'blush'], [1, 1, 8, 8, 1, 1, 'blush']] },
    armL: { anim: 'armA', pivot: [-2.5 - ax, 6.6, 0], boxes: [[-3 - ax, -3 - ax, 3, 6, -1, 0, 'shirt'], [-3 - ax, -3 - ax, 3, 3, -1, 0, 'skin']] },
    armR: { anim: 'armB', pivot: [2.5 + ax, 6.6, 0], boxes: [[2 + ax, 2 + ax, 3, 6, -1, 0, 'shirt'], [2 + ax, 2 + ax, 3, 3, -1, 0, 'skin']] },
  };
  for (const k in extra) parts[k].boxes.push(...extra[k]);
  return { palette: { eye: 0x1b1b1b, blush: 0xf29a8a, ...palette }, parts, wide: !!opt.wide };
}

class VoxGrid {
  constructor() { this.m = new Map(); }
  key(x, y, z) { return x + '|' + y + '|' + z; }
  set(x, y, z, c) { this.m.set(this.key(x, y, z), [x, y, z, c]); }
  has(x, y, z) { return this.m.has(this.key(x, y, z)); }
  // 6면 중 하나라도 비어 있으면 표면. floorY 아래·ceilY 위는 '막힘'으로 보고 지운다(카메라에 안 보이는 면).
  surface(floorY = -Infinity, ceilY = Infinity) {
    const out = [];
    for (const v of this.m.values()) {
      const [x, y, z] = v;
      if (!this.has(x + 1, y, z) || !this.has(x - 1, y, z) || !this.has(x, y, z + 1) || !this.has(x, y, z - 1)
        || (y + 1 <= ceilY && !this.has(x, y + 1, z)) || (y - 1 >= floorY && !this.has(x, y - 1, z))) out.push(v);
    }
    return out;
  }
}

class InstBatch {
  constructor() { this.mats = []; this.cols = []; }
  add(voxels, size, parent = _m2.identity()) {
    const p = parent.clone();
    for (const [x, y, z, c] of voxels) {
      _m.makeScale(size, size, size).setPosition((x + 0.5) * size, (y + 0.5) * size, (z + 0.5) * size);
      this.mats.push(new THREE.Matrix4().multiplyMatrices(p, _m));
      this.cols.push(jitterColor(c));
    }
  }
  build(geo, mat) {
    const im = new THREE.InstancedMesh(geo, mat, this.mats.length);
    this.mats.forEach((m, i) => { im.setMatrixAt(i, m); im.setColorAt(i, this.cols[i]); });
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.computeBoundingSphere();
    return im;
  }
}

function buildTerrain(housePositions) {
  const T = CONFIG.TERRAIN, P = CONFIG.PALETTE;
  const g = new VoxGrid();
  const onPath = (px, pz) => housePositions.some(([hx, hz]) => {
    const len = Math.hypot(hx, hz), t = clamp((px * hx + pz * hz) / (len * len), 0, 1);
    return Math.hypot(px - hx * t, pz - hz * t) < T.PATH_W;
  });
  for (let x = -T.HALF; x < T.HALF; x++) for (let z = -T.HALF; z < T.HALF; z++) {
    const cx = x + 0.5, cz = z + 0.5;
    const dirt = Math.hypot(cx, cz) < T.PLAZA_R + rr(-0.4, 0.4) || onPath(cx, cz);
    for (let y = -T.THICKNESS; y < 0; y++) g.set(x, y, z, y === -1 ? (dirt ? pick(P.DIRT_TOP) : pick(P.GRASS)) : pick(P.DIRT_SIDE));
  }
  staticBatch.add(g.surface(-T.THICKNESS), CONFIG.VOXEL.TERRAIN);

  const tg = new VoxGrid();
  const top = Math.floor(-T.THICKNESS * CONFIG.VOXEL.TERRAIN / CONFIG.VOXEL.TAPER) - 1;
  T.TAPER_RADII.forEach((r, k) => {
    for (let x = -r; x < r; x++) for (let z = -r; z < r; z++)
      if (Math.hypot(x + 0.5, z + 0.5) < r + rr(-0.5, 0.3)) tg.set(x, top - k, z, pick(P.ROCK));
  });
  staticBatch.add(tg.surface(-Infinity, top), CONFIG.VOXEL.TAPER);

  for (let i = 0; i < T.ROCKS; i++) {
    const a = rr(0, Math.PI * 2), d = rr(...T.ROCK_RING);
    const rg = new VoxGrid(), n = ri(...T.ROCK_SIZE);
    for (let x = 0; x < n; x++) for (let z = 0; z < n; z++) for (let y = 0; y < n - (x + z) % 2; y++)

}

function buildGate(angle) {

  const pos = new THREE.Vector3(Math.cos(angle) * G.R, 0, Math.sin(angle) * G.R), M = facingCenter(pos);

  for (let x = -half - 2; x < half + 2; x++) for (let z = -1; z <= 0; z++) { g.set(x, ph, z, P.WOOD); g.set(x, ph + 1, z, P.WOOD); }
  for (let x = -half - 3; x < half + 3; x++) for (let z = -2; z <= 1; z++) g.set(x, ph + 2, z, G.ROOF);
  for (const bx of [-half + 1, half - 2]) for (let y = ph - 3; y < ph; y++) g.set(bx, y, 0, G.BANNER);
  staticBatch.add(g.surface(0), s, M);

function buildAnvil() {

function buildFences() {
  const F = NPC_CONFIG.FENCE, s = F.VOXEL;
  for (const [name, pen] of Object.entries(NPC_CONFIG.PENS)) {
    const [x0, x1, z0, z1] = pen.RECT;
    pens.push({ name, rect: pen.RECT, species: pen.SPECIES });
    const g = new VoxGrid(), c = pen.RECT.map((v) => Math.round(v / s)), step = Math.round(F.POST_EVERY / s);
    const put = (x, z) => {
      const post = (z === c[2] || z === c[3]) ? (x - c[0]) % step === 0 : (z - c[2]) % step === 0;
      if (post) for (let y = 0; y < F.POST_H; y++) g.set(x, y, z, F.POST);

    for (let z = c[2]; z <= c[3]; z++) { put(c[0], z); put(c[1], z); }
    staticBatch.add(g.surface(0), s);

    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, to = new THREE.Vector3(-cx, 0, -cz).normalize();
    const t = Math.min((x1 - x0) / 2 / Math.max(Math.abs(to.x), 1e-6), (z1 - z0) / 2 / Math.max(Math.abs(to.z), 1e-6)) + F.WATCH_OUT;
    poi.fence.push({ pos: new THREE.Vector3(cx + to.x * t, 0, cz + to.z * t), look: new THREE.Vector3(cx, 0, cz) });

}

const blocked = (x, z, extra = 0) => obstacles.some((o) => Math.hypot(x - o.x, z - o.z) < o.r + extra);

const trees = [];
let treeMesh;
function buildTrees() {
  const V = CONFIG.VILLAGE, P = CONFIG.PALETTE, s = CONFIG.VOXEL.TREE;
  const cells = [];
  for (let tries = 0; trees.length < V.TREES && tries < V.TREE_TRIES; tries++) {
    const a = rr(0, Math.PI * 2), d = rr(...V.TREE_RING);
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (blocked(x, z) || inAnyPen(x, z, NPC_CONFIG.PEN_TREE_MARGIN) || trees.some((t) => Math.hypot(t.base.x - x, t.base.z - z) < V.TREE_AVOID_R * 2)) continue;
    const g = new VoxGrid(), th = ri(...V.TREE_TRUNK_H), pine = rand() < V.TREE_PINE_CHANCE;
    for (let y = 0; y < th; y++) for (const tx of [-1, 0]) for (const tz of [-1, 0]) g.set(tx, y, tz, P.TRUNK);

      for (let cx = -Rr - 1; cx <= Rr; cx++) for (let cyy = Math.floor(cy - Rr); cyy <= cy + Rr; cyy++) for (let cz = -Rr - 1; cz <= Rr; cz++)
        if (Math.hypot(cx + 0.5, cyy + 0.5 - cy, cz + 0.5) <= r) g.set(cx, cyy, cz, pick(P.LEAF));
    }
    const surf = g.surface(0);
    const tree = { base: new THREE.Vector3(x, 0, z), start: cells.length, count: surf.length, locals: [],
      angle: 0, target: 0, hold: 0, axis: new THREE.Vector3(1, 0, 0) };
    for (const [vx, vy, vz, c] of surf) {
      tree.locals.push(new THREE.Matrix4().makeScale(s, s, s).setPosition((vx + 0.5) * s, (vy + 0.5) * s, (vz + 0.5) * s));
      cells.push(jitterColor(c));

}
const ZERO_V = new THREE.Vector3();
function updateTreeMatrices(t) {

const SV = { id: 0, level: 1, mesh: null, glow: null, glowCells: [], smokeSrc: [], smokeT: 0, glowT: 0, tone: null,

// 상태: new 나무를 새 나무색으로 · damaged 군데군데 빠지고 그을림(+ 기울기는 행렬) · repairing 윗부분이 비고 새 나무 덧댐 + 비계
function svState(cells, state, seed) {

  for (const [x, y, z, role] of cells) {

    let r = role;
    if (state === 'new' && wood) r = 'newwood';
    if (state === 'damaged') { if (y > 0 && h < S.DROP) continue; if (h2 < S.CHAR) r = 'char'; }
    if (state === 'repairing') { if (y > top * S.REPAIR_TOP && h < S.REPAIR_MISS) continue; if (wood && h2 < S.REPAIR_PATCH) r = 'newwood'; }
    out.push([x, y, z, r]);

}

  for (const y of [mid, h]) { boxCells(out, x0, x1, y, y, z0, z0, 'newwood'); boxCells(out, x0, x0, y, y, z0, z1, 'newwood'); }

}

};

// 놓는 행렬: 마을 중심을 보게 돌리고 모양 가운데를 그 자리에 (파손이면 옆으로 기울임)

// 담기: 단계마다 자기 난수로 색을 흔든다 (게임 쪽 rand() 순서를 바꾸지 않음). 복셀 예산을 넘으면 그 오브젝트는 넣지 않음

// 자리 고르기: 광장·집·나무·목장·우물·구조물·성문·이미 놓은 것에서 떨어진 곳

  if (houses.some((h) => Math.hypot(h.x - x, h.z - z) < h.r + rad + L.HOUSE)) return false;
  if (trees.some((t) => Math.hypot(t.base.x - x, t.base.z - z) < L.TREE + rad)) return false;
  if (inAnyPen(x, z, rad + L.PEN) || Math.hypot(x - wellPos.x, z - wellPos.z) < CONFIG.VILLAGE.WELL_AVOID_R + rad) return false;
  if (props.some((p) => Math.hypot(p.x - x, p.z - z) < p.r + rad + L.OTHER)) return false;
  if (poi.gate && Math.hypot(poi.gate.x - x, poi.gate.z - z) < G.WIDTH / 2 + G.CLEAR + rad) return false;

// L3 성벽: 고리를 토막으로 나눠 접선 방향으로 세운다. 성문·목장·나무·포탑 근처는 비움
function svWall(b, level, taken) {
  const W = VILLAGE_LOOK.WALL, st = W.BY_LEVEL[level - 1];
  if (!st) return;
  const n = Math.floor(2 * Math.PI * W.R / W.SEG), cols = Math.round(W.SEG / W.VOXEL) - 1;   // 토막 사이 한 칸은 비움
  const gate = poi.gate ? Math.atan2(poi.gate.z, poi.gate.x) : null, gateHalf = (NPC_CONFIG.GATE.WIDTH / 2 + W.GATE_CLEAR) / W.R;
  for (let i = 0; i < n; i++) {
    const a = (i + 0.5) / n * Math.PI * 2, x = Math.cos(a) * W.R, z = Math.sin(a) * W.R;
    if (gate !== null && Math.abs(wrapAngle(a - gate)) < gateHalf) continue;
    if (inAnyPen(x, z, W.PEN_MARGIN) || trees.some((t) => Math.hypot(t.base.x - x, t.base.z - z) < W.TREE_CLEAR)
      || taken.some((t) => t.tower && Math.hypot(t.x - x, t.z - z) < W.TOWER_CLEAR + t.r)) continue;
    const c = [];
    for (let k = 0; k < cols; k++) {
      if (st.KIND === 'stake') {   // 목책: 말뚝 높이를 번갈아, 끝은 어둡게(뾰족)
        const h = st.H - 1 + (k % 2);
        for (let y = 0; y < h; y++) c.push([k, y, 0, y < (st.BASE || 0) ? 'stone' : 'wood']);
        c.push([k, h, 0, 'dark']);
      } else {                     // 돌담: 한 칸 두께(복셀 예산), 위는 한 칸 걸러 총안
        for (let y = 0; y < st.H; y++) c.push([k, y, 0, y === st.BAND ? 'band' : 'stone']);
        if (st.CAP && k % 2 === 0) c.push([k, st.H, 0, 'stone']);
      }
    }
    if (st.FLAG_EVERY && i % st.FLAG_EVERY === 0) { boxCells(c, 0, 0, st.H, st.H + 5, 0, 0, 'dark'); boxCells(c, 1, 2, st.H + 3, st.H + 5, 0, 0, 'banner'); }
    const M = new THREE.Matrix4().makeRotationY(Math.PI / 2 - a).setPosition(x, 0, z)
      .multiply(new THREE.Matrix4().makeTranslation(-cols * W.VOXEL / 2, 0, -W.VOXEL / 2));
    if (!b.add(c, W.VOXEL, M, 'level')) { SV.skipped.push('성벽 토막: 복셀 예산 초과'); break; }
  }
}
// L3 포탑: 나무 망루(Lv3) → 지붕(Lv4) → 금속 띠·등불(Lv5). 발판 높이 = 포탑 FIRE_Y. 포탑이 생기기 전 레벨엔 자리에 목재 더미
function svTowers(b, level, taken) {
  const T = VILLAGE_LOOK.TOWER, s = T.VOXEL, H = T.LEG_H;
  if (level === VILLAGE_LOOK.TOWER_PILE_LEVEL) {
    const p = towerSpots(1)[0], pf = svState(PREFAB.woodpile().cells, 'new', 7);
    if (b.add(pf, VILLAGE_LOOK.VOXEL, svObjectMatrix(p.x, p.z, pf, VILLAGE_LOOK.VOXEL), 'level')) taken.push({ x: p.x, z: p.z, r: VILLAGE_LOOK.CLEAR.TOWER, tower: true });
  }
  for (const tw of VS.towers) {
    const c = [], glow = [];
    for (const lx of [-T.HALF, T.HALF]) for (const lz of [-T.HALF, T.HALF]) for (let y = 0; y < H; y++) c.push([lx, y, lz, level >= 5 && y % 3 === 1 ? 'band' : 'wood']);
    boxCells(c, -T.PLAT, T.PLAT, H, H, -T.PLAT, T.PLAT, 'wood');
    for (const lx of [-T.PLAT, T.PLAT]) for (const lz of [-T.PLAT, T.PLAT]) boxCells(c, lx, lx, H + 1, H + 2, lz, lz, 'dark');
    boxCells(c, -1, 1, H + 1, H + 1, 0, 0, 'metal'); c.push([0, H + 1, 1, 'dark']);   // 석궁
    if (level >= 4) for (let k = 0; k < T.ROOF_H; k++) boxCells(c, -T.PLAT + k, T.PLAT - k, H + 3 + k, H + 3 + k, -T.PLAT + k, T.PLAT - k, 'roof');
    if (level >= 5) glow.push([T.PLAT, H + 2, T.PLAT, 'lamp'], [-T.PLAT, H + 2, -T.PLAT, 'lamp']);
    const M = new THREE.Matrix4().makeTranslation(tw.pos.x - s / 2, 0, tw.pos.z - s / 2);
    if (b.add(c, s, M, 'level', glow)) taken.push({ x: tw.pos.x, z: tw.pos.z, r: VILLAGE_LOOK.CLEAR.TOWER, tower: true });
    else SV.skipped.push('포탑: 복셀 예산 초과');
  }
}
// L3 대피소 장식 (레벨 누적): Lv2 문 보강 · Lv3 돌 기초 · Lv4 지붕 경보 종 · Lv5 깃발·처마 등불
function svShelter(b, level) {
  const h = houses.find((x) => x.kind === 'shelter');
  if (!h || level < 2) return;
  const s = VILLAGE_LOOK.SHELTER.VOXEL, HM = new THREE.Matrix4().makeRotationY(h.yaw).setPosition(h.x, 0, h.z);
  const hx0 = -Math.floor(h.w / 2) * h.s, hx1 = hx0 + h.w * h.s, hz0 = -Math.floor(h.d / 2) * h.s, hz1 = hz0 + h.d * h.s;   // 집 바닥 (유닛, 집 좌표)
  const doorX = hx0 + (Math.floor(h.w / 2) + 0.5) * h.s;
  const at = (x, y, z) => HM.clone().multiply(new THREE.Matrix4().makeTranslation(x, y, z));
  const add = (c, M, glow) => { if (!b.add(c, s, M, 'level', glow)) SV.skipped.push('대피소 장식: 복셀 예산 초과'); };
  add(boxCells(boxCells(boxCells([], -3, -3, 0, 4, 0, 0, 'newwood'), 2, 2, 0, 4, 0, 0, 'newwood'), -3, 2, 5, 5, 0, 0, 'newwood'), at(doorX, 0, hz1 + 0.02));
  if (level >= 3) {   // 문 앞은 비운 돌 기초
    const c = [], nx = Math.ceil((hx1 - hx0) / s) + 1, nz = Math.ceil((hz1 - hz0) / s) + 1, doorK = Math.round((doorX - hx0) / s);
    for (let x = -1; x <= nx; x++) for (const z of [-1, nz]) if (!(z === nz && Math.abs(x - doorK) <= 3)) boxCells(c, x, x, 0, 1, z, z, 'stone');
    for (let z = 0; z < nz; z++) for (const x of [-1, nx]) boxCells(c, x, x, 0, 1, z, z, 'stone');
    add(c, at(hx0, 0, hz0));
  }
  if (level >= 4) add(boxCells(boxCells(boxCells([], -2, -2, 0, 3, 0, 0, 'dark'), 2, 2, 0, 3, 0, 0, 'dark'), -2, 2, 4, 4, 0, 0, 'dark').concat(boxCells([], -1, 1, 1, 2, 0, 0, 'bell')),
    at((hx0 + hx1) / 2, CONFIG.SCALE.HOUSE_HEIGHT - s, (hz0 + hz1) / 2));
  if (level >= 5) for (const x of [hx0, hx1 - s]) {
    add(boxCells(boxCells([], 0, 0, 0, 9, 0, 0, 'dark'), 1, 3, 7, 9, 0, 0, 'banner'), at(x, 0, hz1 + s));

// 전투에서 무너졌던 집: 앞 SHOW채는 '복구 중'(비계 + 지붕 한쪽 방수포), 나머지는 '새로 지음'(밝은 지붕). 기능(체력·충돌)은 그대로
function svRepairs(b, repairs) {
  const R = VILLAGE_LOOK.REPAIR, s = R.VOXEL, show = repairs.slice(0, R.SHOW), inv = new THREE.Matrix4(), p = new THREE.Vector3(), c = new THREE.Color();
  for (let j = 0; j < houseMesh.count; j++) houseMesh.setColorAt(j, houseBatch.cols[j]);   // 이전 단계 색 되돌리기
  for (const i of repairs) {
    const h = houses[i];
    if (!h) continue;
    inv.makeRotationY(h.yaw).setPosition(h.x, 0, h.z).invert();
    for (let j = h.start; j < h.start + h.count; j++) {
      p.setFromMatrixPosition(houseBatch.mats[j]).applyMatrix4(inv);
      if (p.y <= h.wallH) continue;   // 지붕만
      houseMesh.setColorAt(j, show.includes(i) && p.x > 0 ? c.set(VILLAGE_LOOK.COLORS.tarp) : c.copy(houseBatch.cols[j]).offsetHSL(0, 0, R.NEW_ROOF_LIGHTEN));
    }
    if (!show.includes(i)) continue;
    const nx = Math.ceil(h.w * h.s / s), nz = Math.ceil(h.d * h.s / s), top = Math.ceil(CONFIG.SCALE.HOUSE_HEIGHT / s);
    const box = [[0, 0, 0, 'x'], [nx - 1, 0, nz - 1, 'x']], out = svScaffold([], box, top, R.PAD);
    const M = new THREE.Matrix4().makeRotationY(h.yaw).setPosition(h.x, 0, h.z).multiply(new THREE.Matrix4().makeTranslation(-nx * s / 2, 0, -nz * s / 2));
    if (b.add(out, s, M, 'stage')) {
      SV.smokeSrc.push({ x: h.x, z: h.z, y: CONFIG.SCALE.HOUSE_HEIGHT, k: 0 });
      SV.repairSpots.push({ pos: h.door.clone(), look: new THREE.Vector3(h.x, 0, h.z) });   // 주민 '복구 작업' 자리
    }
    else SV.skipped.push(`복구 중 비계(집 ${i}): 복셀 예산 초과`);
  }
  if (houseMesh.instanceColor) houseMesh.instanceColor.needsUpdate = true;
}

// 단계가 정해지면 마을을 다시 꾸민다 (?village 미리보기는 단계·레벨을 바꿀 때마다 다시 부른다)
function buildStageVillage(id, level, repairs) {
  for (const m of [SV.mesh, SV.glow]) if (m) { world.remove(m); m.dispose(); }
  const D = VILLAGE_STAGES[id] || VILLAGE_STAGES[1], V = VILLAGE_LOOK, s = V.VOXEL;
  Object.assign(SV, { id, level, repairs, count: { stage: 0, level: 0, glow: 0 }, skipped: [], smokeSrc: [], glowCells: [], repairSpots: [], placed: 0 });
  const b = svBatch(CONFIG.SEED + id * 101 + level), taken = [], torches = [];
  for (const t of VS.towers) taken.push({ x: t.pos.x, z: t.pos.z, r: V.CLEAR.TOWER, tower: true });
  svTowers(b, level, taken); svWall(b, level, taken); svShelter(b, level);   // L3 먼저
  svRepairs(b, repairs);
  const place = (kind, deg, r, state, i) => {   // L2
    const pf = PREFAB[kind](i), cells = svState(pf.cells, state, id * 31 + i), rad = svRadius(cells, s), spot = svFindSpot(deg, r, rad, taken);
    if (!spot) { SV.skipped.push(`${kind} ${deg}°: 빈자리 없음`); return; }
    const tilt = state === 'damaged' ? V.STATE.TILT * (i % 2 ? 1 : -1) : 0;
    if (!b.add(cells, s, svObjectMatrix(spot.x, spot.z, cells, s, tilt), 'stage', pf.glow || [])) { SV.skipped.push(`${kind}: 복셀 예산 초과`); return; }
    taken.push({ x: spot.x, z: spot.z, r: rad });
    SV.placed++;
    if (state === 'damaged' || state === 'repairing') {
      SV.smokeSrc.push({ x: spot.x, z: spot.z, y: V.SMOKE.Y });
      const k = (Math.hypot(spot.x, spot.z) - rad - V.CLEAR.OTHER) / Math.hypot(spot.x, spot.z);   // 마을 쪽 앞에서 손봄
      SV.repairSpots.push({ pos: new THREE.Vector3(spot.x * k, 0, spot.z * k), look: new THREE.Vector3(spot.x, 0, spot.z) });
    }
    if (kind === 'torch') torches.push({ x: spot.x, z: spot.z, y: (pf.glow[1][1] + 1) * s });
  };
  D.OBJECTS.forEach(([k, deg, r, st], i) => place(k, deg, r, st, i));
  D.DECOR.forEach(([k, deg, r], i) => place(k, deg, r, 'normal', D.OBJECTS.length + i));
  SV.smokeSrc = [...SV.smokeSrc, ...torches].slice(0, D.WEATHER === 'smoke' ? V.SMOKE.MAX_SOURCES : 0);

  const im = SV.mesh = new THREE.InstancedMesh(BOX, villageMat, Math.max(1, b.mats.length));
  b.mats.forEach((m, i) => { im.setMatrixAt(i, m); im.setColorAt(i, b.cols[i]); });
  im.count = b.mats.length; im.visible = im.count > 0;
  im.castShadow = im.receiveShadow = true; im.computeBoundingSphere();
  world.add(im);
  const gm = SV.glow = new THREE.InstancedMesh(BOX, svGlowMat, Math.max(1, b.glow.length));
  SV.glowCells = b.glow;
  b.glow.forEach((g, i) => { gm.setMatrixAt(i, _m.makeScale(V.GLOW.SIZE, V.GLOW.SIZE, V.GLOW.SIZE).setPosition(g.pos)); gm.setColorAt(i, _c.set(g.color)); });
  gm.count = b.glow.length; gm.visible = gm.count > 0; gm.computeBoundingSphere();
  world.add(gm);
  if (D.WEATHER === 'smoke') {
    if (!smokePS) {
      const S = V.SMOKE;
      smokePS = createParticles({ pool: S.POOL, size: S.SIZE, gravity: -S.RISE, drag: S.DRAG, floor: -Infinity, fadeIn: 4 });
      smokePS.setFov(CONFIG.CAMERA.FOV);
    }
    world.add(smokePS.points);
  } else if (smokePS) world.remove(smokePS.points);
  svApplyTone(D.TONE);

  const base = houseMesh.count + treeMesh.count + (world.children.find((o) => o.isInstancedMesh && o.userData.staticVillage)?.count || 0);
  const total = base + SV.count.stage + SV.count.level;
  console[total > VOXEL_BUDGET.TOTAL ? 'warn' : 'info'](`[VOXEL_BUDGET] 단계 ${SV.count.stage}/${VOXEL_BUDGET.STAGE} · 레벨 ${SV.count.level}/${VOXEL_BUDGET.LEVEL} · 불꽃 ${SV.count.glow}/${VOXEL_BUDGET.GLOW} · 마을 전체 ${total}/${VOXEL_BUDGET.TOTAL}`);
  gameLog('VILLAGE', `${id}단계 마을: ${D.DAY}일째 ${D.TIME} · ${V.WEATHER_LABEL[D.WEATHER]} · 마을 Lv${level} (성벽 ${V.WALL.BY_LEVEL[level - 1]?.KIND || '없음'}, 포탑 ${VS.towers.length}) · ` +
    `오브젝트 ${D.OBJECTS.length + D.DECOR.length}개 · 무너졌던 집 ${repairs.length}채(복구 중 ${Math.min(repairs.length, V.REPAIR.SHOW)})${SV.skipped.length ? ` · 생략: ${SV.skipped.join(', ')}` : ''}`,
  SV.skipped.length ? 'warn' : 'info');
}
// 단계 하늘·조명 톤 → 분위기(atmo)의 '평소' 쪽 색과 세기 배율. 햇빛·환경광은 LIGHT_MIN_K 아래로 안 내림
function svApplyTone(T) {
  const V = VILLAGE_LOOK;
  for (const k of Object.keys(atmo)) if (k !== 'WINDOW' && T[k] !== undefined) atmo[k][0].set(T[k]);
  SV.tone = { sunK: Math.max(V.LIGHT_MIN_K, T.SUN_K), hemiK: Math.max(V.LIGHT_MIN_K, T.HEMI_K), sat: T.SAT, fogK: T.FOG_K };

// 예고 전 평소 조명을 바로 적용 (?village 미리보기용. 게임 중에는 updateAtmosphere가 같은 값에서 출발)

  hemi.color.copy(atmo.HEMI_SKY[0]); hemi.groundColor.copy(atmo.HEMI_GROUND[0]); hemi.intensity = LC.DAY.HEMI_INT * T.hemiK;

// 매 걸음: 연기 기둥 · 불꽃 깜빡임
function svUpdate(dt) {
  const V = VILLAGE_LOOK;
  if (smokePS && smokePS.points.parent) {
    const S = V.SMOKE;
    SV.smokeT += dt;
    while (SV.smokeT >= S.EVERY) {
      SV.smokeT -= S.EVERY;
      for (const p of SV.smokeSrc) smokePS.spawn(p.x + (Math.random() * 2 - 1) * S.SPREAD, p.y, p.z + (Math.random() * 2 - 1) * S.SPREAD,
        S.DRIFT[0], 0, S.DRIFT[1], R(S.LIFE), S.COLOR[0], S.COLOR[1], S.ALPHA);
    }
    smokePS.update(dt);
  }
  if (!SV.glow || !SV.glowCells.length) return;
  SV.glowT += dt;
  if (SV.glowT < 1 / V.GLOW.RATE) return;
  SV.glowT = 0;
  const t = performance.now() / 1000;
  SV.glowCells.forEach((g, i) => {
    const k = V.GLOW.SIZE * (1 + V.GLOW.FLICKER * Math.sin(t * 11 + g.phase) * Math.sin(t * 7.3 + g.phase * 2));
    SV.glow.setMatrixAt(i, _m.makeScale(k, k, k).setPosition(g.pos));
  });
  SV.glow.instanceMatrix.needsUpdate = true;
}

const grass = { n: 0 };
let grassMesh;
function buildGrass() {
  const V = CONFIG.VILLAGE, n = V.GRASS, G = grass;
  G.x = new Float32Array(n); G.z = new Float32Array(n); G.yaw = new Float32Array(n); G.h = new Float32Array(n);
  G.bend = new Float32Array(n); G.target = new Float32Array(n); G.hold = new Float32Array(n);
  G.dx = new Float32Array(n).fill(1); G.dz = new Float32Array(n);
  G.active = new Set();
  grassMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0), villageMat, n);
  grassMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  let k = 0;
  for (let tries = 0; k < n && tries < V.GRASS_TRIES; tries++) {
    const a = rr(0, Math.PI * 2), d = Math.sqrt(rr(V.GRASS_RING[0] ** 2, V.GRASS_RING[1] ** 2));
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (Math.abs(x) > CONFIG.TERRAIN.HALF - 0.3 || Math.abs(z) > CONFIG.TERRAIN.HALF - 0.3 || blocked(x, z)) continue;
    G.x[k] = x; G.z[k] = z; G.yaw[k] = rr(0, Math.PI); G.h[k] = rr(...V.GRASS_H);

function setGrassMatrix(i) {
  const G = grass, w = CONFIG.VILLAGE.GRASS_W;
  _q.setFromAxisAngle(_v.set(G.dz[i], 0, -G.dx[i]), G.bend[i] * CONFIG.REACT.GRASS_MAX_ANGLE);
  _q.multiply(_q2.setFromAxisAngle(UP, G.yaw[i]));
  grassMesh.setMatrixAt(i, _m.compose(_v2.set(G.x[i], 0, G.z[i]), _q, _v3.set(w, G.h[i], w)));
}

// ============================================================
// 사냥꾼: 파츠별 피벗을 가진 복셀 캐릭터
//   root(위치·방향) → spin(구르기 회전, 몸 중심) → body → 다리·몸통 → 머리·팔
// ============================================================
const hunter = {};
const hunterMat = new THREE.MeshLambertMaterial({ emissive: 0x000000 });
// 게임 속 사냥꾼: 지금 직업 + 장착 장비로 만들어 월드에 넣는다
function buildHunter() {
  Object.assign(hunter, makeHunterModel(save.hunter.job, Progress.lookGrades(save)));
  world.add(hunter.root);
}
// 복셀 사냥꾼 모델 (게임 · 사냥꾼 선택 미리보기 공용). gr = Progress.lookGrades 모양의 장비 등급
//   opt.mat: 재질 (기본 hunterMat) · opt.silhouette: 색 없이 한 색 (잠긴 직업) · opt.shadow: 그림자
function makeHunterModel(job, gr, opt = {}) {
  const mat = opt.mat || hunterMat, silhouette = !!opt.silhouette, shadow = opt.shadow !== false, out = {};
  const P = CONFIG.PALETTE, s = CONFIG.SCALE.HUNTER_HEIGHT / CONFIG.VOXEL.HUNTER_CELLS_H;
  const box = (cells, x0, x1, y0, y1, z0, z1, colorFn) => {
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) cells.push([x, y, z, colorFn(x, y, z)]);
  };
  const part = (cells, pivot, parentPivot) => {
    const g = new VoxGrid(); cells.forEach((c) => g.set(...c));
    const surf = g.surface();
    const im = new THREE.InstancedMesh(BOX, mat, surf.length);
    surf.forEach(([x, y, z, c], i) => {
      im.setMatrixAt(i, _m.makeScale(s, s, s).setPosition((x + 0.5 - pivot[0]) * s, (y + 0.5 - pivot[1]) * s, (z + 0.5 - pivot[2]) * s));
      if (!silhouette) im.setColorAt(i, jitterColor(c, CONFIG.VOXEL.COLOR_JITTER * 0.5));   // 실루엣은 인스턴스 색 없이 재질 색 하나
    });
    im.computeBoundingSphere();
    im.castShadow = im.receiveShadow = shadow;
    const pg = new THREE.Group(); pg.add(im);
    pg.position.set((pivot[0] - parentPivot[0]) * s, (pivot[1] - parentPivot[1]) * s, (pivot[2] - parentPivot[2]) * s);
    return pg;
  };
  // 직업마다 옷 색과 무기 복셀이 다르다 (data HUNTERS.JOBS[].LOOK, HUNTERS.WEAPONS[].VOXELS)
  const LOOK = HUNTERS.JOBS[job].LOOK, WV = HUNTERS.WEAPONS[job].VOXELS, WC = HUNTERS.WEAPON_COLORS;
  const ROOT = [0, 0, 0], WAIST = [0, 4, 0];
  const leg = (x0) => { const c = []; box(c, x0, x0 + 1, 0, 3, -1, 0, (x, y) => (y <= 1 ? P.BOOTS : LOOK.pants)); return c; };
  const torsoC = []; box(torsoC, -2, 1, 4, 6, -1, 0, (x, y) => (y === 4 ? P.BELT : LOOK.tunic));
  const headC = []; box(headC, -3, 2, 7, 11, -3, 1, (x, y, z) => {
    if (z === 1 && y === 8 && (x === -2 || x === 1)) return P.EYE;
    if (y === 11 || z <= -2 || ((x === -3 || x === 2) && y >= 9) || (z === 1 && y === 10)) return LOOK.hair;
    return P.SKIN;
  });
  const armL = []; box(armL, -3, -3, 3, 6, -1, 0, (x, y) => (y >= 5 ? LOOK.tunic : P.SKIN));
  const armR = []; box(armR, 2, 2, 3, 6, -1, 0, (x, y) => (y >= 5 ? LOOK.tunic : P.SKIN));
  // 장비 외형 (EQUIPMENT.LOOK): 등급이 오르면 파츠가 붙고, 무기는 길어지며 금속 색이 등급 색으로 바뀐다
  const LK = EQUIPMENT.LOOK, GROW = HUNTERS.WEAPONS[job].GROW;
  const cols = (g, enh) => {
    const [m, a] = LK.PALETTE[g] || LK.PALETTE[1];
    return { main: enh >= LK.ENH_TRIM ? Progress.mixHex(m, 0xffffff, LK.TRIM_LIGHTEN) : m, accent: a, glow: LK.GLOW_COLOR };
  };
  const addBoxes = (cells, boxes, cl, mirror = false) => {
    for (const b of boxes || []) {
      let [x0, x1, y0, y1, z0, z1, c = 'main'] = b;
      if (mirror) [x0, x1] = [-1 - x1, -1 - x0];   // 왼쪽 기준 → 오른쪽 (x' = -1 - x)
      box(cells, x0, x1, y0, y1, z0, z1, () => cl[c]);
    }
  };
  const wc = cols(gr.weapon, gr.weaponEnh);
  const wColor = (c) => (gr.weapon >= 2 && (c === 'steel' || c === 'iron') ? wc.main : gr.weapon >= 2 && c === 'guard' ? wc.accent : WC[c]);
  for (const [x0, x1, y0, y1, z0, z1, c] of WV.armR) box(armR, x0, x1, y0, y1, z0, z1, () => wColor(c));
  for (const [x0, x1, y0, y1, z0, z1, c] of WV.armL) box(armL, x0, x1, y0, y1, z0, z1, () => wColor(c));
  const grow = Math.min(LK.BLADE_ADD[gr.weapon - 1] || 0, GROW.MAX ?? Infinity);
  const extraStart = armR.length + armL.length + torsoC.length + headC.length;
  for (const [arm, cells] of [['armR', armR], ['armL', armL]]) for (const gp of GROW[arm]) for (let i = 0; i < grow; i++) {
    const tip = i === grow - 1 && gr.weaponEnh >= LK.ENH_GLOW;
    for (const [x, y, z] of gp.from) cells.push([x + gp.dir[0] * i, y + gp.dir[1] * i, z + gp.dir[2] * i, tip ? LK.GLOW_COLOR : wColor(GROW.color)]);
  }
  addBoxes(headC, LK.HEAD[gr.head], cols(gr.head, gr.armorEnh));
  addBoxes(torsoC, LK.BODY[gr.body], cols(gr.body, gr.armorEnh));
  addBoxes(armL, LK.SHOULDER[gr.body], cols(gr.body, gr.armorEnh));
  addBoxes(armR, LK.SHOULDER[gr.body], cols(gr.body, gr.armorEnh), true);
  if (gr.charm) {
    const cc = cols(gr.charm, 0);
    addBoxes(torsoC, gr.charm >= LK.CHARM.HIGH_FROM ? LK.CHARM.HIGH : LK.CHARM.LOW, { main: gr.charm >= 5 ? cc.glow : cc.accent });
  }
  const legLC = leg(-2), legRC = leg(0), legBase = legLC.length * 2;
  addBoxes(legLC, LK.LEGS[gr.legs], cols(gr.legs, gr.armorEnh));
  addBoxes(legRC, LK.LEGS[gr.legs], cols(gr.legs, gr.armorEnh), true);
  const extra = armR.length + armL.length + torsoC.length + headC.length - extraStart + legLC.length + legRC.length - legBase;
  if (extra > LK.EXTRA_VOXEL_MAX) console.warn(`[HUNTER] 장비 외형 복셀 ${extra}칸 > 한도 ${LK.EXTRA_VOXEL_MAX}`);

  const half = CONFIG.SCALE.HUNTER_HEIGHT / 2;
  out.root = new THREE.Group();
  out.spin = new THREE.Group(); out.spin.position.y = half;
  out.body = new THREE.Group(); out.body.position.y = -half;
  out.legL = part(legLC, [-1, 4, 0], ROOT);
  out.legR = part(legRC, [1, 4, 0], ROOT);
  out.torso = part(torsoC, WAIST, ROOT);
  out.head = part(headC, [0, 7, -0.5], WAIST);
  out.armL = part(armL, [-2.5, 6.6, 0], WAIST);
  out.armR = part(armR, [2.5, 6.6, 0], WAIST);
  out.torso.add(out.head, out.armL, out.armR);
  out.body.add(out.legL, out.legR, out.torso);
  out.spin.add(out.body);
  out.root.add(out.spin);
  out.voxels = 0;
  out.root.traverse((o) => { if (o.isInstancedMesh) out.voxels += o.count; });
  return out;
}

function createParticles(opt) {
  const N = opt.pool;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 4), vel = new Float32Array(N * 3);
  const c0 = new Float32Array(N * 3), c1 = new Float32Array(N * 3);
  const life = new Float32Array(N), age = new Float32Array(N).fill(1), a0 = new Float32Array(N);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 4).setUsage(THREE.DynamicDrawUsage));
  const mat = new THREE.PointsMaterial({ size: 1, vertexColors: true, transparent: true, depthWrite: false, sizeAttenuation: true,
    blending: opt.additive ? THREE.AdditiveBlending : THREE.NormalBlending, toneMapped: !opt.additive, fog: !opt.additive });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false; points.layers.set(L_FX);
  let head = 0, alive = 0;
  const ca = new THREE.Color(), cb = new THREE.Color();
  return {
    points,
    setFov(fovDeg) { mat.size = opt.size / Math.tan(THREE.MathUtils.degToRad(fovDeg) / 2); }, // 화면 크기 ≈ 월드 크기
    spawn(x, y, z, vx, vy, vz, lifeT, colA, colB = colA, alpha = 1) {
      const i = head; head = (head + 1) % N;
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      vel[i * 3] = vx; vel[i * 3 + 1] = vy; vel[i * 3 + 2] = vz;
      ca.set(colA); cb.set(colB);
      c0[i * 3] = ca.r; c0[i * 3 + 1] = ca.g; c0[i * 3 + 2] = ca.b;
      c1[i * 3] = cb.r; c1[i * 3 + 1] = cb.g; c1[i * 3 + 2] = cb.b;
      life[i] = lifeT; age[i] = 0; a0[i] = alpha; alive = N;
    },
    update(dt) {
      if (!alive) return;
      const drag = Math.exp(-opt.drag * dt);
      let any = 0;
      for (let i = 0; i < N; i++) {
        if (age[i] >= life[i]) { col[i * 4 + 3] = 0; continue; }
        any++;
        age[i] += dt;
        const k = age[i] / life[i];
        vel[i * 3] *= drag; vel[i * 3 + 2] *= drag; vel[i * 3 + 1] = vel[i * 3 + 1] * drag - opt.gravity * dt;
        pos[i * 3] += vel[i * 3] * dt; pos[i * 3 + 1] += vel[i * 3 + 1] * dt; pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
        if (pos[i * 3 + 1] < opt.floor) { pos[i * 3 + 1] = opt.floor; vel[i * 3 + 1] = 0; }
        for (let j = 0; j < 3; j++) col[i * 4 + j] = c0[i * 3 + j] + (c1[i * 3 + j] - c0[i * 3 + j]) * k;
        col[i * 4 + 3] = a0[i] * (1 - k) * (opt.fadeIn ? Math.min(1, k * opt.fadeIn) : 1);
      }
      if (!any) alive = 0;
      geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true;
    },
  };
}

const D = CONFIG.DUST;
const dust = createParticles({ pool: D.POOL, size: D.SIZE, gravity: D.GRAVITY, drag: D.DRAG, floor: D.FLOOR });

function dustBurst(p, count, k = 1) {
  for (let n = 0; n < count; n++) {
    const a = Math.random() * Math.PI * 2, sp = R(D.SPEED) * k, r = Math.random() * D.SPREAD;
    _c.set(D.COLOR).offsetHSL(0, 0, (Math.random() * 2 - 1) * D.JITTER);
    dust.spawn(p.x + Math.cos(a) * r, D.Y0, p.z + Math.sin(a) * r, Math.cos(a) * sp, R(D.UP) * k, Math.sin(a) * sp, R(D.LIFE), _c.getHex(), _c.getHex(), D.ALPHA);
  }
}

// 복셀 파편: 작은 정육면체가 튀고 굴러간다
const shards = (() => {
  const S = COMBAT_CONFIG.SHARDS, N = S.POOL;
  const mesh = new THREE.InstancedMesh(BOX, new THREE.MeshLambertMaterial(), N);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false; mesh.layers.set(L_FX); mesh.castShadow = false;
  const st = Array.from({ length: N }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), q: new THREE.Quaternion(),
    axis: new THREE.Vector3(1, 0, 0), spin: 0, size: 0, life: 0, age: 1 }));
  for (let i = 0; i < N; i++) { mesh.setMatrixAt(i, ZERO_M); mesh.setColorAt(i, _c.set(0xffffff)); }
  let head = 0, active = 0;
  return {
    mesh,
    burst(p, count, colors, k = 1) {
      for (let n = 0; n < count; n++) {
        const s = st[head]; mesh.setColorAt(head, _c.set(colors[n % colors.length]));
        head = (head + 1) % N;
        const a = Math.random() * Math.PI * 2, sp = R(S.SPEED) * k;
        s.p.copy(p); s.v.set(Math.cos(a) * sp, R(S.UP) * k, Math.sin(a) * sp);
        s.axis.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
        s.spin = (Math.random() - 0.5) * S.SPIN; s.q.identity();
        s.size = R(S.SIZE); s.life = R(S.LIFE); s.age = 0;
      }
      mesh.instanceColor.needsUpdate = true; active = N;
    },
    update(dt) {
      if (!active) return;
      let any = 0;
      for (let i = 0; i < N; i++) {
        const s = st[i];
        if (s.age >= s.life) { if (s.size) { mesh.setMatrixAt(i, ZERO_M); s.size = 0; } continue; }
        any++;
        s.age += dt;
        s.v.y -= S.GRAVITY * dt;
        s.p.addScaledVector(s.v, dt);
        const half = s.size / 2;
        if (s.p.y < half) { s.p.y = half; s.v.y = -s.v.y * S.BOUNCE; s.v.x *= S.FRICTION; s.v.z *= S.FRICTION; s.spin *= S.FRICTION; }
        s.q.multiply(_q.setFromAxisAngle(s.axis, s.spin * dt));
        const sc = s.size * Math.min(1, (s.life - s.age) / (s.life * 0.3));
        mesh.setMatrixAt(i, _m.compose(s.p, s.q, _v.setScalar(Math.max(sc, 0))));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (!any) active = 0;
    },
  };
})();

const MONSTER_H = CONFIG.SCALE.HOUSE_HEIGHT * CONFIG.SCALE.MONSTER_TO_HOUSE;

  grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.25, '#ffffffaa'); grd.addColorStop(1, '#ffffff00');

}
const GLOW_TEX = makeGlowTexture();

function makeEye(parent, x, y, z) {

function countTris(obj) {
  let n = 0;
  obj.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry, per = g.index ? g.index.count / 3 : g.attributes.position.count / 3;
    n += per * (o.isInstancedMesh ? o.count : 1);
  });
  return Math.round(n);
}

function createPrimitiveMonster() {
  const C = MONSTER_CONFIG;
  const mat = new THREE.MeshStandardMaterial({ color: C.COLOR, roughness: C.ROUGHNESS, metalness: C.METALNESS });
  const weakMat = new THREE.MeshStandardMaterial({ color: C.WEAK_COLOR, roughness: C.ROUGHNESS, metalness: C.METALNESS,
    emissive: C.WEAK_EMISSIVE, emissiveIntensity: 0 });
  addRim(mat); addRim(weakMat);
  const group = new THREE.Group();
  const mk = (geo, m = mat, parent = group) => {
    const o = new THREE.Mesh(geo, m); o.castShadow = o.receiveShadow = true; o.layers.set(L_MONSTER); parent.add(o); return o;
  };
  const lumpy = (segs, amp, freq) => {
    const g = new THREE.SphereGeometry(1, segs[0], segs[1]), p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      _v.fromBufferAttribute(p, i);
      const n = Math.sin(_v.x * freq * 1.3 + _v.z * freq) * Math.sin(_v.y * freq * 1.7 + _v.x * freq * 0.6) + 0.5 * Math.sin(_v.z * freq * 2.9 + _v.y * freq * 2.1);
      _v.multiplyScalar(1 + n * amp); p.setXYZ(i, _v.x, _v.y, _v.z);
    }
    g.computeVertexNormals(); return g;
  };
  const capsule = (r, len) => new THREE.CapsuleGeometry(r, len, C.LIMB_SEGS[0], C.LIMB_SEGS[1]);

  const torsoG = new THREE.Group(); group.add(torsoG);
  const torso = mk(lumpy(C.TORSO_SEGS, C.LUMP_AMP, C.LUMP_FREQ), mat, torsoG);
  torso.scale.set(...C.TORSO_R);
  const spines = new THREE.InstancedMesh(new THREE.ConeGeometry(C.SPINE_R, 1, 6).translate(0, 0.5, 0), mat, C.SPINES);
  for (let i = 0; i < C.SPINES; i++) {
    const t = i / (C.SPINES - 1), y = lerp(C.SPINE_Y[0], C.SPINE_Y[1], t);
    const z = -C.TORSO_R[2] * Math.sqrt(Math.max(0, 1 - (y / C.TORSO_R[1]) ** 2)) * 0.9;
    spines.setMatrixAt(i, _m.compose(_v.set(0, y, z), _q.setFromAxisAngle(_v2.set(1, 0, 0), -C.SPINE_TILT), _v3.set(1, lerp(C.SPINE_H[0], C.SPINE_H[1], t), 1)));
  }
  spines.castShadow = true; spines.layers.set(L_MONSTER); torsoG.add(spines);

  const neck = mk(capsule(C.NECK_R, C.NECK_LEN));
  const headG = new THREE.Group(); group.add(headG);
  mk(lumpy(C.HEAD_SEGS, C.LUMP_AMP, C.LUMP_FREQ * 1.5), mat, headG).scale.set(...C.HEAD_R);
  const eyes = [makeEye(headG, C.EYE_X, C.EYE_Y, C.EYE_Z), makeEye(headG, -C.EYE_X, C.EYE_Y, C.EYE_Z)];

  // 다리 + 무릎 관절(약점) + 발톱(약점)
  const clawGeo = new THREE.ConeGeometry(C.CLAW_R, C.CLAW_LEN, 6).rotateX(Math.PI / 2).translate(0, 0, C.CLAW_LEN / 2);
  const legs = [0, 1].map(() => {
    const footG = new THREE.Group(); group.add(footG);
    mk(capsule(C.FOOT_R, C.FOOT_LEN).rotateX(Math.PI / 2), mat, footG);
    const claws = new THREE.Group(); footG.add(claws);
    for (let k = 0; k < C.CLAWS; k++) {
      const c = mk(clawGeo, weakMat, claws);
      c.position.set((k - (C.CLAWS - 1) / 2) * C.CLAW_SPREAD, -C.FOOT_R * 0.4, C.FOOT_LEN / 2 + C.FOOT_R * 0.6);
      c.rotation.x = C.CLAW_TILT;
    }
    const kneeCap = mk(lumpy([12, 9], C.LUMP_AMP * 1.5, C.LUMP_FREQ * 2), weakMat);
    kneeCap.scale.setScalar(C.KNEECAP_R);
    return { thigh: mk(capsule(C.THIGH_R, C.THIGH)), shin: mk(capsule(C.SHIN_R, C.SHIN)), footG, claws, kneeCap };
  });
  const arms = [0, 1].map(() => ({ upper: mk(capsule(C.UPPER_ARM_R, C.UPPER_ARM)), fore: mk(capsule(C.FOREARM_R, C.FOREARM)),
    hand: mk(new THREE.SphereGeometry(C.HAND_R, 10, 8)) }));
  // 꼬리 + 꼬리 끝(약점)
  const T = C.TAIL;
  const tailSegs = Array.from({ length: T.SEGS }, (_, i) => mk(capsule(lerp(T.R[0], T.R[1], i / (T.SEGS - 1)), T.SEG_LEN)));
  const tailTip = mk(lumpy([14, 10], C.LUMP_AMP * 2, C.LUMP_FREQ * 2.5), weakMat);
  tailTip.scale.setScalar(T.TIP_R);

  const feet = [0, 1].map(() => ({ planted: new THREE.Vector3(), from: new THREE.Vector3(), to: new THREE.Vector3(), pos: new THREE.Vector3(), swinging: false }));
  const hurt = makeHurtList();
  const H = Object.fromEntries(hurt.map((h) => [h.id, h]));
  const st = { gait: 0, walking: false };
  const contacts = [];
  const v = { right: new THREE.Vector3(), hipC: new THREE.Vector3(), hip: new THREE.Vector3(), knee: new THREE.Vector3(),
    ankle: new THREE.Vector3(), sh: new THREE.Vector3(), elbow: new THREE.Vector3(), hand: new THREE.Vector3(), pole: new THREE.Vector3(),
    raised: new THREE.Vector3(), tq: new THREE.Quaternion(), yq: new THREE.Quaternion(), nb: new THREE.Vector3(), nd: new THREE.Vector3(),
    hp: new THREE.Vector3(), look: new THREE.Vector3(), d: new THREE.Vector3(), b: new THREE.Vector3(), t0: new THREE.Vector3(),
    t1: new THREE.Vector3(), dir: new THREE.Vector3() };

  function solveIK(a, target, l1, l2, pole, outMid, outEnd) {
    v.d.subVectors(target, a);
    let dist = Math.max(v.d.length(), 1e-3);
    const max = (l1 + l2) * 0.999;
    if (dist > max) { v.d.multiplyScalar(max / dist); dist = max; }
    outEnd.copy(a).add(v.d);
    v.d.divideScalar(dist);
    const x = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist), h = Math.sqrt(Math.max(0, l1 * l1 - x * x));
    v.b.copy(pole).addScaledVector(v.d, -pole.dot(v.d));
    if (v.b.lengthSq() < 1e-6) v.b.set(0, 0, 1);
    v.b.normalize();
    outMid.copy(a).addScaledVector(v.d, x).addScaledVector(v.b, h);
  }
  function placeSeg(mesh, a, b) {
    mesh.position.addVectors(a, b).multiplyScalar(0.5);
    mesh.quaternion.setFromUnitVectors(UP, _v.subVectors(b, a).normalize());
  }

  // ---------- 뱀 (무르가): 마디가 앞 마디를 따라가는 사슬, 머리를 들 수 있음, 땅속으로 잠김 ----------

  // ---------- 떠 있는 갓 (녹투르나): 갓 + 촉수 8개가 각자 땅을 짚음. 방사 대칭 ----------

  // ---------- 실루엣 파츠 (MONSTER_DETAIL.SPECIES[종].PARTS): 이 디테일 단계에 맞는 것만 만들고, 매 프레임 기록된 자리에 붙인다 ----------
  const V3 = () => new THREE.Vector3();
  fx.neck = neck.map(() => ({ a: V3(), b: V3(), r: 0 }));
  fx.tail = tailE.map(() => ({ a: V3(), b: V3(), r: 0 }));

    if (P.TYPE === 'HORN' && S.HEAD) for (const sd of [-1, 1]) add({ sd });
    if (P.TYPE === 'NECK') fx.neck.forEach((rec, i) => { if (i % P.EVERY === 0) add({ rec }); });
    if (P.TYPE === 'TAIL') fx.tail.forEach((rec, i) => { if (i % P.EVERY === 0) add({ rec }); });
    if (P.TYPE === 'WING') fx.wing.forEach((rec) => add({ rec }));
    if (P.TYPE === 'LEG_LOW') for (const leg of legs) if (!P.LEGS || P.LEGS.includes(S.LEGS.indexOf(leg.L))) for (let n = 0, N = nOf(P); n < N; n++) add({ leg, n, N });

  // 판(육각 판): 축(Y)을 면 방향 nrm으로 → 너비 w, 두께 th / 원뿔: 바닥 base에서 dir로 길이 h
  const plateAt = (e, c, nrm, w, th) => { Q.setFromUnitVectors(UP, T1.copy(nrm).normalize()); put(e, c, Q, w, th, w); };

  function drawDetail(fwd) {

      const e = d.e;
      if (P.TYPE === 'BACK') {   // 몸통 타원 표면 (몸 좌표 → 몸통 회전), 뒤로 LEAN만큼 눕힘

        L1.addVectors(r.a, r.b).multiplyScalar(0.5).addScaledVector(perp(T2, L3), r.r * 0.8);
        spike(e, P, L1, L2, P.TYPE === 'TAIL' ? 0.5 + 0.5 * r.r / Math.max(1e-3, fx.tail[0].r) : 1);   // 꼬리 끝으로 갈수록 작게
      } else if (P.TYPE === 'WING') {
        spike(e, P, d.rec.p, d.rec.d);
      } else if (P.TYPE === 'LEG_LOW') {   // 정강이 아래 1/3: 축 둘레에 고르게, 바깥(sd) 쪽부터
        const lg = d.leg; L3.subVectors(lg.ankle, lg.kneeP).normalize();
        L1.crossVectors(L3, fwd); if (L1.lengthSq() < 1e-6) L1.copy(v.right); L1.normalize();
        L2.crossVectors(L3, L1);
        const a = (d.n / d.N) * Math.PI * 2 + (lg.sd < 0 ? Math.PI : 0);
        T2.copy(L1).multiplyScalar(Math.cos(a)).addScaledVector(L2, Math.sin(a));
        L1.copy(lg.kneeP).lerp(lg.ankle, P.AT).addScaledVector(T2, lg.L.R2 * k * 0.8);
        spike(e, P, L1, T2);
      } else if (P.TYPE === 'SEG') {   // 뱀 마디: 양옆 가시 고리 / 등 판
        const r = d.rec, sc = r.r / (SN.R[0] * k);
        L3.set(-r.d.z, 0, r.d.x);
        if (P.UP) { L2.copy(UP).addScaledVector(r.d, -0.3).normalize(); L1.copy(r.p).addScaledVector(L2, r.r * 0.92); }
        else { L2.copy(L3).multiplyScalar(d.sd).addScaledVector(UP, 0.5).normalize(); L1.copy(r.p).addScaledVector(L2, r.r * 0.85); }
        spike(e, P, L1, L2, sc);
      } else if (P.TYPE === 'TENT') {   // 촉수 마디: 갓 중심에서 바깥으로
        L2.subVectors(d.rec.p, fl.c).setY(0).normalize().addScaledVector(UP, -0.2).normalize();
        L1.copy(d.rec.p).addScaledVector(L2, d.rec.r * 0.8);
        spike(e, P, L1, L2, d.rec.r / (FL.R[0] * k) * 0.5 + 0.5);
      } else if (P.TYPE === 'RIM') {   // 갓 가장자리 둘째 줄 (첫 줄 사이사이, 위로 더 세움)
        const a = fl.yaw + ((d.n + 0.5) / d.N) * Math.PI * 2, f = 0.82, hy = FL.DOME[1] * k * 2 * (2 - fx.breath);
        L1.set(Math.cos(a) * FL.DOME[0] * k * fx.breath * f, hy * Math.sqrt(1 - f * f), Math.sin(a) * FL.DOME[0] * k * fx.breath * f).add(fl.c);
        L2.set(Math.cos(a), 0.6, Math.sin(a)).normalize();
        spike(e, P, L1, L2);
      }
    }
  }

  // ---------- 부위 상태 · 분노 · 호흡 (매 프레임) ----------
  const chunkE = Array.from({ length: PD.CHUNK_POOL }, () => ({ e: inst('crys'), life: 0, r: 0, pos: V3(), vel: V3(), axis: V3(), ang: 0 }));
  const COL = new THREE.Color(), COL2 = new THREE.Color(), CQ = new THREE.Quaternion(), ZERO = new THREE.Vector3();
  const pulseOf = (rng, hz, t) => lerp(rng[0], rng[1], 0.5 + 0.5 * Math.sin(t * hz * Math.PI * 2));
  function spawnChunks(id) {
    const h = H[id]; if (!h) return;
    let n = PD.CHUNKS;
    for (const c of chunkE) {
      if (c.life > 0 || n <= 0) continue;
      n--;
      const a = Math.random() * Math.PI * 2, sp = R(PD.CHUNK_SPEED);
      c.life = PD.CHUNK_LIFE; c.r = h.r * R(PD.CHUNK_R); c.pos.copy(h.pos);
      c.vel.set(Math.cos(a) * sp, R(PD.CHUNK_UP), Math.sin(a) * sp);
      c.axis.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(); c.ang = 0;
    }
  }
  function updateDetailFx(ctx) {
    const dt = ctx.dt, t = ctx.time;
    fx.rage = damp(fx.rage, MS.rage ? 1 : 0, RG.RATE, dt);
    const hzK = lerp(1, RG.PULSE_HZ_K, fx.rage), crK = lerp(1, RG.CRACK_K, fx.rage) * GLOW_K;   // 분노 × 단계 발광
    // 호흡·꼬리: 위상을 쌓아서 빠르기가 바뀌어도 튀지 않게
    const busy = Math.max(fx.rage, MS.state === 'chase' ? 1 : 0);
    fx.breathPh += dt * lerp(MO.BREATH_HZ[0], MO.BREATH_HZ[1], busy) * Math.PI * 2;
    fx.tailPh += dt * lerp(MO.TAIL_HZ[0], MO.TAIL_HZ[1], fx.rage) * Math.PI * 2;
    fx.breath = 1 + (MS.state === 'stagger' ? MO.BREATH_AMP_STAGGER : MO.BREATH_AMP) * Math.sin(fx.breathPh);
    // 부위: 건강(천천히 맥동) → 균열(금이 번지고 빨리 맥동, 맞으면 깜빡) → 파괴(속이 드러나고 어두운 기운)
    for (const id in parts) {
      const ps = MS.parts?.[id], P = C.PARTS[id];
      if (!ps || !P) continue;
      const ratio = clamp(ps.hp / P.hp, 0, 1), cracked = ratio <= PD.CRACK_AT;
      if (fx.last[id] !== undefined && ps.hp < fx.last[id]) fx.flash[id] = PD.HIT_FLASH;
      fx.last[id] = ps.hp;
      fx.flash[id] = Math.max(0, (fx.flash[id] || 0) - dt);
      let pulse = pulseOf(cracked ? PD.CRACK_PULSE : PD.PULSE, (cracked ? PD.PULSE_HZ[1] : PD.PULSE_HZ[0]) * hzK, t) * crK;
      if (cracked && fx.flash[id] > 0) pulse *= PD.HIT_FLASH_K;
      COL.setRGB(cracked ? lerp(PD.CRACK_MIN, 1, 1 - ratio / PD.CRACK_AT) : 0, pulse, 0);
      COL2.setRGB(1, pulseOf(PD.INNER_PULSE, PD.INNER_HZ, t) * crK, 1);
      for (const e of parts[id]) { pools[e.p].setColorAt(e.i, COL); if (e.inner) pools.weak.setColorAt(e.inner.i, COL2); }
      if (ps.broken && H[id]) {   // 어두운 기운이 부서진 자리에서 피어오름 (피·살 없음)
        if (fx.brokenAt[id] === undefined) fx.brokenAt[id] = t;
        fx.acc[id] = (fx.acc[id] || 0) + dt * (t - fx.brokenAt[id] < PD.AURA_TIME ? PD.AURA_RATE : PD.AURA_RATE_LATE);
        const p = H[id].pos, j = H[id].r;
        while (fx.acc[id] >= 1) {
          fx.acc[id]--;
          const a = Math.random() * Math.PI * 2, s = R(PD.AURA_SPEED);
          aura.spawn(p.x + (Math.random() - 0.5) * j, p.y + (Math.random() - 0.5) * j, p.z + (Math.random() - 0.5) * j,
            Math.cos(a) * s, R(PD.AURA_UP), Math.sin(a) * s, R(PD.AURA_LIFE), PD.AURA_COLOR_DARK, crU.uCrGlow.value.getHex(), 1);
        }
      }
    }
    // 실루엣 파츠의 금: 몬스터 체력 구간마다 더 번짐
    const hpR = MS.hp / Math.max(1, C.HP), band = hpR <= PD.BODY_CRACK_AT[1] ? 2 : hpR <= PD.BODY_CRACK_AT[0] ? 1 : 0;
    bodyU.uCrack.value = PD.BODY_CRACK[band];
    bodyU.uPulse.value = band ? PD.BODY_PULSE * crK * (0.5 + 0.5 * Math.sin(fx.breathPh)) : 0;
    // 분노: 몸 색이 눈 색 쪽으로
    fx.col.copy(fx.base).lerp(fx.rageCol, RG.TINT_K * fx.rage);
    mat.color.copy(fx.col); detailMat.color.copy(fx.col); if (domeMat) domeMat.color.copy(fx.col);
    // 떨어져 나간 조각: 튀어 오르고 땅에 튕기며 빛이 꺼짐
    for (const c of chunkE) {
      if (c.life <= 0) { pools.crys.setMatrixAt(c.e.i, M.compose(ZERO, CQ.identity(), SC.set(0, 0, 0))); continue; }
      c.life -= dt;
      c.vel.y -= PD.CHUNK_GRAVITY * dt; c.pos.addScaledVector(c.vel, dt);
      if (c.pos.y < c.r) { c.pos.y = c.r; c.vel.y = Math.abs(c.vel.y) * PD.CHUNK_BOUNCE; c.vel.x *= PD.CHUNK_BOUNCE; c.vel.z *= PD.CHUNK_BOUNCE; }
      c.ang += PD.CHUNK_SPIN * dt * (c.vel.lengthSq() > 1 ? 1 : 0.1);
      const s = c.r * Math.min(1, c.life / (PD.CHUNK_LIFE * 0.25));
      pools.crys.setMatrixAt(c.e.i, M.compose(c.pos, CQ.setFromAxisAngle(c.axis, c.ang), SC.set(s, s, s)));
      pools.crys.setColorAt(c.e.i, COL.setRGB(1, PD.CRACK_PULSE[1] * Math.max(0, c.life / PD.CHUNK_LIFE), 0));
    }
    for (const p of [pools.weak, pools.crys]) if (p.instanceColor) p.instanceColor.needsUpdate = true;
  }

  // ---------- 프레임 갱신 ----------
  function update(ctx) {
    contacts.length = 0;
    const fwd = ctx.fwd;
    v.right.set(-fwd.z, 0, fwd.x);
    updateDetailFx(ctx);
    if (snake) drawSerpent(ctx, fwd);
    else if (fl) drawFloater(ctx, fwd);
    else {
      const u = ctx.mode === 'walk' ? (st8.gait / (S.STEP * k)) % 1 : 0;
      const bob = ctx.mode === 'walk' ? S.BOB * k * (1 - Math.sin(Math.PI * u)) : 0;
      v.c.copy(ctx.root).setY(ctx.y + S.BODY_H * k - ctx.pose.crouch - bob);
      walkLegs(ctx, v.c, fwd);
      v.c.copy(ctx.root).setY(ctx.y + S.BODY_H * k - ctx.pose.crouch - bob);
      const by = (S.BODY ? K(S.BODY.R)[1] : k) * CLIMB_CONFIG.POINTS.BACK_UP;   // 등 = 몸통 위쪽
      H.back.pos.copy(v.c).addScaledVector(UP, by);
      if (!head) H.head.pos.copy(H.back.pos).addScaledVector(fwd, S.BODY ? K(S.BODY.R)[2] : k);   // 머리가 없는 체형은 몸통 앞 위
      drawBodyParts(ctx, v.c, fwd);
    }
    drawDetail(fwd);
    for (const p of Object.values(pools)) p.instanceMatrix.needsUpdate = true;
    return contacts;
  }
  function land(ctx) {
    contacts.length = 0;
    v.right.set(-ctx.fwd.z, 0, ctx.fwd.x);
    for (const leg of legs) { restFoot(leg.planted, leg, ctx.root, ctx.fwd); leg.pos.copy(leg.planted); leg.swinging = false; contacts.push({ pos: leg.planted.clone(), land: true, light: !!leg.L.LIGHT }); }
    if (fl) for (const t of fl.tent) { t.planted.set(Math.cos(t.a) * FL.REST * k, 0, Math.sin(t.a) * FL.REST * k).add(ctx.root).setY(0); t.pos.copy(t.planted); contacts.push({ pos: t.planted.clone(), land: true }); }
    if (snake) { snake.pts.length = 0; contacts.push({ pos: ctx.root.clone().setY(0), land: true }); }
    return contacts;
  }
  // 파괴: 그 부위 도형(빛나는 약점)을 숨김. 판정은 남겨 몸통 배율로 맞음 (partMult) — 모든 약점을 부숴도 때릴 곳이 남게
  //   숨은 약점(핵·턱)만 판정을 끈다 (몸 속이라 노출 때만 맞아야 함) / 노출: 숨은 약점을 보이고 판정을 켬
  //   파괴 연출: 갑각·결정 조각이 떨어져 나가고(chunkE) 그 자리에 어두운 속 + 약한 빛 금이 드러남 (6-12, 피·살 없음)
  function setBroken(id) {
    for (const e of parts[id] || []) { e.hidden = true; e.broken = true; }
    if (H[id] && C.PARTS[id]?.hidden) H[id].active = false;
    spawnChunks(id);
  }
  function setExposed(id, on) {
    if (MS.parts[id]?.broken) return;
    for (const e of parts[id] || []) e.hidden = !on;
    if (H[id]) H[id].active = on;
  }
  // 인스턴스 색(균열 데이터)을 처음부터 만들어 둔다 → 첫 그리기 전에 셰이더가 이 형태로 컴파일됨
  for (const p of [pools.weak, pools.crys]) for (let i = 0; i < p.count; i++) p.setColorAt(i, COL.setRGB(0, PD.PULSE[0], 0));
  for (const c of chunkE) pools.crys.setMatrixAt(c.e.i, M.compose(ZERO, CQ.identity(), SC.set(0, 0, 0)));
  const ankle = legs.length ? Math.min(...legs.map((l) => l.L.FOOT_R)) * k * 2 : 0;
  const detailN = details.reduce((n, d) => n + d.es.length, 0);
  return { kind: `primitive-${bodyKey}`, group, materials: [mat, weakMat, glowM, detailMat, ...(domeMat ? [domeMat] : [])], weakMat, tris: countTris(group), eyes, hurt,
    feet: feetOut, update, land, setBroken, setExposed, ankleH: Math.max(CONFIG.SCALE.HUNTER_HEIGHT, ankle), heightTarget: S.H0 * k,
    detail: { level: detailLevel, parts: detailN, tex: maps ? `${DS.TEX.PATTERN} ${maps.size}px (${maps.ms}ms)` : '없음', fx } };
}

function checkMonsterBudget(model) {
  const S = MONSTER_CONFIG.SLOT, tris = countTris(model);
  if (tris > S.MAX_TRIS) return `삼각형 ${tris} > ${S.MAX_TRIS}`;
  let bad = null;
  model.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) for (const k in m) {
      const t = m[k];
      if (t && t.isTexture && t.image && (t.image.width > S.MAX_TEX || t.image.height > S.MAX_TEX)) bad = `텍스처 ${k} ${t.image.width}×${t.image.height} > ${S.MAX_TEX}`;
    }
  });
  return bad;
}

function createGLBMonster(gltf) {
  const S = MONSTER_CONFIG.SLOT;
  const group = new THREE.Group(), model = gltf.scene;
  group.add(model);
  const box = new THREE.Box3().setFromObject(model), h = box.max.y - box.min.y;
  const k = S.fitHeight ? MONSTER_H / h : S.scale;
  model.scale.setScalar(k); model.position.y = -box.min.y * k;
  const materials = [];
  // 모델에 노멀맵이 없으면 그 종의 절차적 질감(MONSTER_DETAIL.SPECIES[].TEX)을 씌운다 (UV가 있을 때만)
  const DS = MONSTER_DETAIL.SPECIES[game.stage.monsterId], maps = DS ? makeDetailMaps(DS.TEX, MONSTER_DETAIL.LOD[DETAIL_LEVEL.level].TEX) : null;
  let procTex = 0;
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true; o.layers.set(L_MONSTER);
    if (o.isSkinnedMesh) o.frustumCulled = false;
    for (const m of [].concat(o.material)) {
      if (m.isMeshStandardMaterial) {
        if (maps && !m.normalMap && o.geometry.attributes.uv) { applyDetailMaps(m, maps, DS.TEX); procTex++; }
        addRim(m);
      }
      materials.push(m);
    }
  });
  if (procTex) gameLog('DETAIL', `GLB 재질 ${procTex}개에 노멀맵이 없어 절차적 질감 ${DS.TEX.PATTERN} ${maps.size}px 적용`);
  const bone = (n) => model.getObjectByName(n);
  const feetB = S.footBones.map(bone).filter(Boolean);
  if (feetB.length < S.footBones.length) console.warn(`[MONSTER_SLOT] 발 뼈 ${S.footBones.join(',')} 중 일부를 못 찾음 → 그 발은 접촉 이벤트 없음`);
  const hurt = Object.keys(S.partBones).map((id) => ({ id, r: S.HURT_R * MS.sizeK, pos: new THREE.Vector3(), active: !MONSTER_CONFIG.PARTS[id]?.hidden }));
  const hurtBones = hurt.map((hb) => bone(S.partBones[hb.id]));
  hurt.forEach((hb, i) => { if (!hurtBones[i]) { hb.active = false; console.warn(`[MONSTER_SLOT] 약점 뼈 '${S.partBones[hb.id]}' 없음 → ${hb.id} 판정 끔`); } });
  const eyes = S.eyeBones.map(bone).filter(Boolean).map((b) => makeEye(b, 0, 0, 0));
  const mixer = new THREE.AnimationMixer(model);
  const clip = THREE.AnimationClip.findByName(gltf.animations, S.walkClip) || gltf.animations[0];
  const action = clip ? mixer.clipAction(clip).play() : null;
  if (!clip) console.warn('[MONSTER_SLOT] 애니메이션 클립 없음 → 정지 상태로 이동');
  const prevY = feetB.map(() => Infinity), contacts = [], feet = feetB.map(() => new THREE.Vector3());
  const toLocal = (b, out) => world.worldToLocal(b.getWorldPosition(out));
  function update(ctx) {
    contacts.length = 0;
    group.position.set(ctx.root.x, ctx.y - ctx.pose.crouch * 0.3, ctx.root.z);
    group.rotation.y = Math.atan2(ctx.fwd.x, ctx.fwd.z) + S.yawOffset;
    if (action) action.timeScale = ctx.mode === 'walk' ? 1 : 0;
    mixer.update(ctx.dt);
    feetB.forEach((b, i) => {
      toLocal(b, feet[i]);
      if (ctx.mode === 'walk' && prevY[i] > S.contactY && feet[i].y <= S.contactY) contacts.push({ pos: feet[i].clone().setY(0), land: false });
      prevY[i] = feet[i].y;
    });
    hurt.forEach((hb, i) => { if (hurtBones[i]) toLocal(hurtBones[i], hb.pos); });
    return contacts;
  }
  return {
    kind: 'glb', group, materials, weakMat: null, tris: countTris(model), eyes, hurt, feet, ankleH: S.contactY,
    detail: { level: DETAIL_LEVEL.level, parts: 0, tex: procTex ? `${DS.TEX.PATTERN} ${maps.size}px (절차적, ${procTex}개 재질)` : '모델 텍스처', fx: null },
    update,
    land(ctx) {
      update({ ...ctx, mode: 'stand' });
      contacts.length = 0;
      feet.forEach((p) => contacts.push({ pos: p.clone().setY(0), land: true }));
      if (!feet.length) contacts.push({ pos: ctx.root.clone(), land: true });
      return contacts;
    },
    setBroken(id) { const i = hurt.findIndex((hb) => hb.id === id); if (hurtBones[i]) hurtBones[i].scale.setScalar(0.001); },
    setExposed(id, on) { const h = hurt.find((hb) => hb.id === id); if (h && !MS.parts[id]?.broken) h.active = on; },
  };
}

// 종별 임시 도형: 체형 규격(SHAPES)으로. 규격이 없는 체형만 예전 도형 거인
function createPrimitiveFor(body) {
  if (!MONSTER_CONFIG.SHAPES[body]) {
    const m = createPrimitiveMonster();
    m.setExposed = () => {};
    return m;
  }
  // 한 번 만들어 선 자세로 실제 높이를 재고, MONSTER_SCALE 목표와 FIT_TOL 넘게 다르면 그 비율로 다시 만든다
  //   (날개·뿔·고개처럼 설계 높이 밖으로 튀어나오는 부분까지 맞춰, 단계마다 반드시 커지게)
  const target = game.stage.sizeK * CONFIG.SCALE.HOUSE_HEIGHT, MAX = MONSTER_CONFIG.SLOT.MAX_TRIS;
  // 삼각형 예산(2만): 넘으면 디테일 단계를 내려 다시 만든다 (실루엣 파츠·분할 수가 줄어듦)
  let lv = DETAIL_LEVEL.level, m = createCreature(body, 1, lv);
  while (m.tris > MAX && lv > 0) {
    console.warn(`[DETAIL] ${body} 디테일 ${lv}: 삼각형 ${m.tris} > ${MAX} → 디테일 ${lv - 1}`);
    disposeCreature(m); m = createCreature(body, 1, --lv);
  }
  let measured = measureCreature(m), fit = target / measured;
  if (Math.abs(fit - 1) > MONSTER_CONFIG.FIT_TOL) { disposeCreature(m); m = createCreature(body, fit, lv); measured = measureCreature(m); }
  m.fit = { target, measured, fitK: fit };
  return m;
}
// 원점에서 선 자세로 한 번 그려 높이를 잰다 (InstancedMesh 경계 상자를 새로 계산)
function measureCreature(m) {
  const neutral = { crouch: 0, lean: 0, armsUp: 0, slamT: 0, slamPoint: new THREE.Vector3(), tailDown: 0, glow: 0, expose: 0, tilt: 0, fly: 0, sink: 0 };
  const ctx = { root: new THREE.Vector3(), fwd: new THREE.Vector3(0, 0, 1), y: 0, mode: 'stand', move: 0, dt: 1 / 60, time: 0, pose: neutral, hunter: new THREE.Vector3(0, 1, 30) };
  m.land(ctx); m.update(ctx); m.update(ctx);
  m.group.updateMatrixWorld(true);
  const box = new THREE.Box3(), b = new THREE.Box3();
  m.group.traverse((o) => { if (o.isInstancedMesh && o.count) { o.boundingBox = null; o.computeBoundingBox(); b.copy(o.boundingBox).applyMatrix4(o.matrixWorld); box.union(b); o.boundingBox = null; } });
  return Math.max(1e-3, box.max.y - Math.max(0, box.min.y));
}
function disposeCreature(m) {
  m.group.traverse((o) => { if (o.isInstancedMesh) { o.geometry.dispose(); o.dispose(); } });
  for (const mat of m.materials) mat.dispose();
}

const quality = { frames: 0, time: 0, sinceChange: 0, total: 0, avg: 0, bad: 0, log: [] };

  if (fxOn) return ['후처리 끔', () => { fxOn = false; }];
  const d = CONFIG.QUALITY.DPR_STEPS.find((x) => x < dpr - 1e-3);
  if (d !== undefined) return [`DPR ${dpr.toFixed(2)} → ${d}`, () => { dpr = d; resize(); }];

}

  const Q = CONFIG.QUALITY;
  quality.total += rawDt; quality.sinceChange += rawDt;
  if (quality.total < Q.WARMUP || quality.sinceChange < Q.SETTLE) return;
  quality.frames++; quality.time += rawDt;
  if (quality.time < Q.WINDOW) return;
  quality.avg = quality.frames / quality.time;
  quality.frames = 0; quality.time = 0;
  if (quality.avg >= Q.FPS_MIN) { quality.bad = 0; return; }
  if (++quality.bad < Q.BAD_WINDOWS) return;
  quality.bad = 0;
  const step = nextQualityStep();
  if (!step) return;
  console.warn(`[QUALITY] 평균 ${quality.avg.toFixed(1)}fps < ${Q.FPS_MIN} → ${step[0]}`);

  let dx = e.clientX - input.ox, dy = e.clientY - input.oy;

  if (len > P.STICK_RADIUS) { dx *= P.STICK_RADIUS / len; dy *= P.STICK_RADIUS / len; }
  knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  const k = Math.hypot(dx, dy) / P.STICK_RADIUS;
  input.jx = k < P.DEADZONE ? 0 : dx / P.STICK_RADIUS;
  input.jz = k < P.DEADZONE ? 0 : dy / P.STICK_RADIUS;
});
const endStick = (e) => {

// 화면 기준 입력 → 월드 방향 (카메라 yaw 기준)
const camYaw = THREE.MathUtils.degToRad(CONFIG.CAMERA.YAW_DEG);
const SCREEN_RIGHT = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
const SCREEN_DOWN = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
const moveDir = new THREE.Vector3();
function readMove() {
  let x = input.jx, z = input.jz;
  const K = input.keys;
  if (K.has('a') || K.has('arrowleft')) x -= 1;
  if (K.has('d') || K.has('arrowright')) x += 1;
  if (K.has('w') || K.has('arrowup')) z -= 1;
  if (K.has('s') || K.has('arrowdown')) z += 1;
  moveDir.copy(SCREEN_RIGHT).multiplyScalar(x).addScaledVector(SCREEN_DOWN, z);
  const len = moveDir.length();
  if (len > 1) moveDir.divideScalar(len);
  return Math.min(len, 1);
}
